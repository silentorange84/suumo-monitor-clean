name: HOME'S Property Detail Test

on:
  workflow_dispatch:

jobs:
  investigate-homes-detail:
    runs-on: ubuntu-latest

    steps:
      - name: Test HOME'S property detail extraction
        run: |
          python - <<'PY'
          import re
          import html
          import urllib.parse
          import urllib.request

          # ==================================================
          # TARGET AREAS
          # ==================================================

          cities = {
              "中野区": "13114",
              "杉並区": "13115",
              "豊島区": "13116",
              "練馬区": "13120",
              "八王子市": "13201",
              "立川市": "13202",
              "武蔵野市": "13203",
              "三鷹市": "13204",
              "西東京市": "13229",
          }

          base_url = "https://www.homes.co.jp/kodate/chuko/tokyo/list/"

          params = []

          for city_name, city_code in cities.items():
              params.append(
                  (f"cond[city][{city_code}]", city_code)
              )

          params.append(("cond[pref]", "13"))

          list_url = (
              base_url
              + "?"
              + urllib.parse.urlencode(params)
          )

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 "
                  "(iPhone; CPU iPhone OS 18_0 like Mac OS X) "
                  "AppleWebKit/605.1.15 "
                  "(KHTML, like Gecko) "
                  "Version/18.0 Mobile/15E148 Safari/604.1"
              ),
              "Accept": (
                  "text/html,application/xhtml+xml,"
                  "application/xml;q=0.9,*/*;q=0.8"
              ),
              "Accept-Language": "ja-JP,ja;q=0.9,en-US;q=0.5",
              "Connection": "close",
          }

          # ==================================================
          # FETCH
          # ==================================================

          def fetch(url):

              req = urllib.request.Request(
                  url,
                  headers=headers
              )

              with urllib.request.urlopen(
                  req,
                  timeout=30
              ) as response:

                  raw = response.read()
                  status = response.status
                  final_url = response.geturl()

              text = raw.decode(
                  "utf-8",
                  errors="ignore"
              )

              return status, final_url, text

          # ==================================================
          # HTML CLEANER
          # ==================================================

          def clean_html(text):

              text = re.sub(
                  r"<script.*?</script>",
                  " ",
                  text,
                  flags=re.I | re.S
              )

              text = re.sub(
                  r"<style.*?</style>",
                  " ",
                  text,
                  flags=re.I | re.S
              )

              text = re.sub(
                  r"<[^>]+>",
                  " ",
                  text
              )

              text = html.unescape(text)

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()

          # ==================================================
          # DIRECT STATION WALK DETECTOR
          # ==================================================

          def extract_direct_station_walk(title):

              if not title:
                  return None, "NOT_FOUND"

              # ----------------------------------------------
              # バス利用を含むタイトルは原則除外
              #
              # 例:
              # 西八王子駅 バス17分 諏訪中央下車 徒歩7分
              #
              # → 駅徒歩7分ではないため対象外
              # ----------------------------------------------

              if re.search(
                  r"駅.{0,40}バス\s*[0-9]+\s*分",
                  title
              ):
                  return None, "BUS_ROUTE"

              # ----------------------------------------------
              # 駅から直接徒歩
              #
              # 例:
              # 高円寺駅 徒歩8分
              # 西武柳沢駅 徒歩14分
              # 阿佐ケ谷駅 徒歩6分
              # ----------------------------------------------

              matches = re.findall(
                  r"([^\s、｜|（）()]+駅)"
                  r".{0,20}?"
                  r"徒歩\s*([0-9]+)\s*分",
                  title
              )

              if matches:

                  minutes = [
                      int(minute)
                      for station, minute in matches
                  ]

                  if minutes:
                      return min(minutes), "TITLE_DIRECT_WALK"

              # ----------------------------------------------
              # km表記は徒歩とはみなさない
              #
              # 例:
              # 高尾駅 5.5km
              # ----------------------------------------------

              if re.search(
                  r"駅.{0,20}[0-9.]+\s*km",
                  title,
                  flags=re.I
              ):
                  return None, "DISTANCE_KM"

              return None, "NOT_FOUND"

          # ==================================================
          # START
          # ==================================================

          print("=" * 70)
          print("HOME'S DETAIL EXTRACTION TEST")
          print("=" * 70)

          print()
          print("LIST URL:")
          print(list_url)

          status, final_url, list_html = fetch(
              list_url
          )

          print()
          print(
              "LIST HTTP STATUS:",
              status
          )

          print(
              "LIST FINAL URL:",
              final_url
          )

          print(
              "LIST HTML SIZE:",
              len(list_html)
          )

          if status != 200:
              raise SystemExit(
                  f"List page returned HTTP {status}"
              )

          # ==================================================
          # PROPERTY URL EXTRACTION
          # ==================================================

          absolute_urls = re.findall(
              r'https?://(?:www\.)?homes\.co\.jp/'
              r'kodate/b-[^"\'<>\s?#]+/?',
              list_html
          )

          relative_urls = re.findall(
              r'["\']'
              r'(/kodate/b-[^"\'<>\s?#]+/?)'
              r'["\']',
              list_html
          )

          property_urls = set()

          for u in absolute_urls:

              property_urls.add(
                  u.rstrip("/")
                  + "/"
              )

          for u in relative_urls:

              property_urls.add(
                  "https://www.homes.co.jp"
                  + u.rstrip("/")
                  + "/"
              )

          property_urls = sorted(
              property_urls
          )

          print()
          print(
              "PROPERTY URL COUNT:",
              len(property_urls)
          )

          if not property_urls:
              raise SystemExit(
                  "No property detail URLs found"
              )

          # ==================================================
          # TEST FIRST 5 PROPERTIES
          # ==================================================

          test_urls = property_urls[:5]

          for index, property_url in enumerate(
              test_urls,
              1
          ):

              print()
              print("=" * 70)
              print(
                  f"PROPERTY TEST {index}"
              )
              print("=" * 70)

              print("URL:")
              print(property_url)

              try:

                  detail_status, detail_final_url, detail_html = fetch(
                      property_url
                  )

              except Exception as e:

                  print(
                      "FETCH ERROR:",
                      repr(e)
                  )

                  continue

              print(
                  "HTTP STATUS:",
                  detail_status
              )

              print(
                  "HTML SIZE:",
                  len(detail_html)
              )

              text = clean_html(
                  detail_html
              )

              # ==================================================
              # TITLE
              # ==================================================

              title = ""

              title_match = re.search(
                  r"<title>(.*?)</title>",
                  detail_html,
                  flags=re.I | re.S
              )

              if title_match:

                  title = clean_html(
                      title_match.group(1)
                  )

              # ==================================================
              # ADDRESS
              # ==================================================

              address = None

              m = re.search(
                  r"所在地\s*(東京都[^\s]+)",
                  text
              )

              if m:
                  address = m.group(1)

              # ==================================================
              # PRICE
              # ==================================================

              price = None

              price_patterns = [
                  r"価格\s*([0-9,]+)\s*万円",
                  r"([0-9,]+)\s*万円\s*支払い目安",
              ]

              for pattern in price_patterns:

                  m = re.search(
                      pattern,
                      text
                  )

                  if m:

                      price = int(
                          m.group(1).replace(
                              ",",
                              ""
                          )
                      )

                      break

              # ==================================================
              # BUILDING AREA
              # ==================================================

              building_area = None

              area_patterns = [
                  r"建物面積\s*([0-9.]+)\s*(?:㎡|m²)",
                  r"建物面積\s*([0-9.]+)",
              ]

              for pattern in area_patterns:

                  m = re.search(
                      pattern,
                      text
                  )

                  if m:

                      building_area = float(
                          m.group(1)
                      )

                      break

              # ==================================================
              # BUILD YEAR / AGE
              # ==================================================

              build_year = None
              build_month = None
              age_years = None

              m = re.search(
                  r"築年月\s*"
                  r"([0-9]{4})年\s*"
                  r"([0-9]{1,2})月"
                  r"(?:\s*（築([0-9]+)年）)?",
                  text
              )

              if m:

                  build_year = int(
                      m.group(1)
                  )

                  build_month = int(
                      m.group(2)
                  )

                  if m.group(3):

                      age_years = int(
                          m.group(3)
                      )

              if age_years is None:

                  m = re.search(
                      r"築([0-9]+)年",
                      text
                  )

                  if m:

                      age_years = int(
                          m.group(1)
                      )

              # ==================================================
              # WALK
              # ==================================================

              min_walk, walk_source = (
                  extract_direct_station_walk(
                      title
                  )
              )

              if min_walk is not None:
                  walking_minutes = [
                      min_walk
                  ]
              else:
                  walking_minutes = []

              # ==================================================
              # LAND RIGHT
              # ==================================================

              land_right = None

              land_patterns = [
                  r"土地権利\s*([^\s]{1,20})",
                  r"権利\s*([^\s]{1,20})",
              ]

              for pattern in land_patterns:

                  m = re.search(
                      pattern,
                      text
                  )

                  if m:

                      land_right = m.group(1)

                      break

              # ==================================================
              # CONDITION CHECK
              # ==================================================

              price_ok = (
                  price is not None
                  and price <= 7000
              )

              area_ok = (
                  building_area is not None
                  and building_area >= 70
              )

              age_ok = (
                  age_years is not None
                  and age_years <= 25
              )

              walk_ok = (
                  min_walk is not None
                  and min_walk <= 15
              )

              ownership_ok = (
                  land_right is not None
                  and "所有権" in land_right
              )

              all_ok = all([
                  price_ok,
                  area_ok,
                  age_ok,
                  walk_ok,
                  ownership_ok,
              ])

              # ==================================================
              # OUTPUT
              # ==================================================

              print()
              print("EXTRACTED DATA")
              print("-" * 70)

              print(
                  "TITLE:",
                  title
              )

              print(
                  "ADDRESS:",
                  address
              )

              print(
                  "PRICE_MAN_YEN:",
                  price
              )

              print(
                  "BUILDING_AREA_M2:",
                  building_area
              )

              print(
                  "BUILD_YEAR:",
                  build_year
              )

              print(
                  "BUILD_MONTH:",
                  build_month
              )

              print(
                  "AGE_YEARS:",
                  age_years
              )

              print(
                  "WALKING_MINUTES_FOUND:",
                  walking_minutes
              )

              print(
                  "MIN_WALK_MINUTES:",
                  min_walk
              )

              print(
                  "WALK_SOURCE:",
                  walk_source
              )

              print(
                  "LAND_RIGHT:",
                  land_right
              )

              print()
              print("CONDITION CHECK")
              print("-" * 70)

              print(
                  "PRICE <= 7000:",
                  price_ok
              )

              print(
                  "BUILDING AREA >= 70:",
                  area_ok
              )

              print(
                  "AGE <= 25:",
                  age_ok
              )

              print(
                  "WALK <= 15:",
                  walk_ok
              )

              print(
                  "OWNERSHIP:",
                  ownership_ok
              )

              print(
                  "ALL CONDITIONS:",
                  all_ok
              )

          print()
          print("=" * 70)
          print(
              "DETAIL EXTRACTION TEST COMPLETE"
          )
          print("=" * 70)

          PY

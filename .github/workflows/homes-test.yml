name: HOME'S Property Detail Test

on:
  workflow_dispatch:

jobs:
  investigate-homes-detail:
    runs-on: ubuntu-latest

    steps:
      - name: Test HOME'S property detail extraction
        run: |
          python - <<'PY'
          import re
          import html
          import urllib.parse
          import urllib.request

          # --------------------------------------------------
          # 対象9市区
          # --------------------------------------------------
          cities = {
              "中野区": "13114",
              "杉並区": "13115",
              "豊島区": "13116",
              "練馬区": "13120",
              "八王子市": "13201",
              "立川市": "13202",
              "武蔵野市": "13203",
              "三鷹市": "13204",
              "西東京市": "13229",
          }

          base_url = "https://www.homes.co.jp/kodate/chuko/tokyo/list/"

          params = []

          for city_name, city_code in cities.items():
              params.append(
                  (f"cond[city][{city_code}]", city_code)
              )

          params.append(("cond[pref]", "13"))

          list_url = base_url + "?" + urllib.parse.urlencode(params)

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) "
                  "AppleWebKit/605.1.15 "
                  "(KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
              ),
              "Accept": (
                  "text/html,application/xhtml+xml,application/xml;"
                  "q=0.9,*/*;q=0.8"
              ),
              "Accept-Language": "ja-JP,ja;q=0.9,en-US;q=0.5",
              "Connection": "close",
          }

          def fetch(url):
              req = urllib.request.Request(
                  url,
                  headers=headers
              )

              with urllib.request.urlopen(
                  req,
                  timeout=30
              ) as response:
                  raw = response.read()
                  status = response.status
                  final_url = response.geturl()

              text = raw.decode(
                  "utf-8",
                  errors="ignore"
              )

              return status, final_url, text

          def clean_html(text):
              text = re.sub(
                  r"<script.*?</script>",
                  " ",
                  text,
                  flags=re.I | re.S
              )

              text = re.sub(
                  r"<style.*?</style>",
                  " ",
                  text,
                  flags=re.I | re.S
              )

              text = re.sub(
                  r"<[^>]+>",
                  " ",
                  text
              )

              text = html.unescape(text)

              text = re.sub(
                  r"\s+",
                  " ",
                  text
              )

              return text.strip()

          # --------------------------------------------------
          # 一覧取得
          # --------------------------------------------------

          print("=" * 70)
          print("HOME'S DETAIL EXTRACTION TEST")
          print("=" * 70)

          print()
          print("LIST URL:")
          print(list_url)

          status, final_url, list_html = fetch(list_url)

          print()
          print("LIST HTTP STATUS:", status)
          print("LIST FINAL URL:", final_url)
          print("LIST HTML SIZE:", len(list_html))

          if status != 200:
              raise SystemExit(
                  f"List page returned HTTP {status}"
              )

          # --------------------------------------------------
          # 詳細URL抽出
          # --------------------------------------------------

          absolute_urls = re.findall(
              r'https?://(?:www\.)?homes\.co\.jp/kodate/b-[^"\'<>\s?#]+/?',
              list_html
          )

          relative_urls = re.findall(
              r'["\'](/kodate/b-[^"\'<>\s?#]+/?)["\']',
              list_html
          )

          property_urls = set()

          for u in absolute_urls:
              property_urls.add(
                  u.rstrip("/") + "/"
              )

          for u in relative_urls:
              property_urls.add(
                  "https://www.homes.co.jp"
                  + u.rstrip("/")
                  + "/"
              )

          property_urls = sorted(property_urls)

          print()
          print(
              "PROPERTY URL COUNT:",
              len(property_urls)
          )

          if not property_urls:
              raise SystemExit(
                  "No property detail URLs found"
              )

          # --------------------------------------------------
          # 先頭5物件を詳細解析
          # --------------------------------------------------

          test_urls = property_urls[:5]

          for index, property_url in enumerate(
              test_urls,
              1
          ):

              print()
              print("=" * 70)
              print(f"PROPERTY TEST {index}")
              print("=" * 70)

              print("URL:")
              print(property_url)

              try:
                  detail_status, detail_final_url, detail_html = fetch(
                      property_url
                  )

              except Exception as e:
                  print(
                      "FETCH ERROR:",
                      repr(e)
                  )
                  continue

              print(
                  "HTTP STATUS:",
                  detail_status
              )

              print(
                  "HTML SIZE:",
                  len(detail_html)
              )

              text = clean_html(
                  detail_html
              )

              # --------------------------------------------------
              # タイトル
              # --------------------------------------------------

              title_match = re.search(
                  r"<title>(.*?)</title>",
                  detail_html,
                  flags=re.I | re.S
              )

              title = ""

              if title_match:
                  title = clean_html(
                      title_match.group(1)
                  )

              # --------------------------------------------------
              # 価格
              # --------------------------------------------------

              price = None

              price_patterns = [
                  r"価格\s*([0-9,]+)\s*万円",
                  r"([0-9,]+)\s*万円\s*支払い目安",
              ]

              for pattern in price_patterns:
                  m = re.search(
                      pattern,
                      text
                  )

                  if m:
                      price = int(
                          m.group(1).replace(",", "")
                      )
                      break

              # --------------------------------------------------
              # 建物面積
              # --------------------------------------------------

              building_area = None

              area_patterns = [
                  r"建物面積\s*([0-9.]+)\s*(?:㎡|m²)",
                  r"建物面積\s*([0-9.]+)",
              ]

              for pattern in area_patterns:
                  m = re.search(
                      pattern,
                      text
                  )

                  if m:
                      building_area = float(
                          m.group(1)
                      )
                      break

              # --------------------------------------------------
              # 築年月・築年数
              # --------------------------------------------------

              build_year = None
              build_month = None
              age_years = None

              m = re.search(
                  r"築年月\s*([0-9]{4})年\s*([0-9]{1,2})月"
                  r"(?:\s*（築([0-9]+)年）)?",
                  text
              )

              if m:
                  build_year = int(
                      m.group(1)
                  )

                  build_month = int(
                      m.group(2)
                  )

                  if m.group(3):
                      age_years = int(
                          m.group(3)
                      )

              if age_years is None:
                  m = re.search(
                      r"築([0-9]+)年",
                      text
                  )

                  if m:
                      age_years = int(
                          m.group(1)
                      )

              # --------------------------------------------------
              # 徒歩
              # 1. タイトル内を最優先
              # 2. 取れなければ交通欄付近
              # 3. ページ全体の最小値は使わない
              # --------------------------------------------------

              walking_minutes = []
              min_walk = None
              walk_source = None

              title_walks = [
                  int(x)
                  for x in re.findall(
                      r"徒歩\s*([0-9]+)\s*分",
                      title
                  )
              ]

              if title_walks:
                  walking_minutes = title_walks
                  min_walk = min(title_walks)
                  walk_source = "TITLE"

              if min_walk is None:
                  transport_match = re.search(
                      r"交通(.{0,1200})",
                      text,
                      flags=re.I | re.S
                  )

                  if transport_match:
                      transport_text = transport_match.group(1)

                      transport_walks = [
                          int(x)
                          for x in re.findall(
                              r"徒歩\s*([0-9]+)\s*分",
                              transport_text
                          )
                      ]

                      if transport_walks:
                          walking_minutes = transport_walks
                          min_walk = min(transport_walks)
                          walk_source = "TRANSPORT"

              if min_walk is None:
                  walking_minutes = []
                  walk_source = "NOT_FOUND"

              # --------------------------------------------------
              # 土地権利
              # --------------------------------------------------

              land_right = None

              land_patterns = [
                  r"土地権利\s*([^\s]{1,20})",
                  r"権利\s*([^\s]{1,20})",
              ]

              for pattern in land_patterns:
                  m = re.search(
                      pattern,
                      text
                  )

                  if m:
                      land_right = m.group(1)
                      break

              # --------------------------------------------------
              # 所在地
              # --------------------------------------------------

              address = None

              m = re.search(
                  r"所在地\s*(東京都[^\s]+)",
                  text
              )

              if m:
                  address = m.group(1)

              # --------------------------------------------------
              # 判定
              # --------------------------------------------------

              price_ok = (
                  price is not None
                  and price <= 7000
              )

              area_ok = (
                  building_area is not None
                  and building_area >= 70
              )

              age_ok = (
                  age_years is not None
                  and age_years <= 25
              )

              walk_ok = (
                  min_walk is not None
                  and min_walk <= 15
              )

              ownership_ok = (
                  land_right is not None
                  and "所有権" in land_right
              )

              all_ok = all([
                  price_ok,
                  area_ok,
                  age_ok,
                  walk_ok,
                  ownership_ok,
              ])

              # --------------------------------------------------
              # 出力
              # --------------------------------------------------

              print()
              print("EXTRACTED DATA")
              print("-" * 70)

              print(
                  "TITLE:",
                  title
              )

              print(
                  "ADDRESS:",
                  address
              )

              print(
                  "PRICE_MAN_YEN:",
                  price
              )

              print(
                  "BUILDING_AREA_M2:",
                  building_area
              )

              print(
                  "BUILD_YEAR:",
                  build_year
              )

              print(
                  "BUILD_MONTH:",
                  build_month
              )

              print(
                  "AGE_YEARS:",
                  age_years
              )

              print(
                  "WALKING_MINUTES_FOUND:",
                  walking_minutes
              )

              print(
                  "MIN_WALK_MINUTES:",
                  min_walk
              )

              print(
                  "WALK_SOURCE:",
                  walk_source
              )

              print(
                  "LAND_RIGHT:",
                  land_right
              )

              print()
              print("CONDITION CHECK")
              print("-" * 70)

              print(
                  "PRICE <= 7000:",
                  price_ok
              )

              print(
                  "BUILDING AREA >= 70:",
                  area_ok
              )

              print(
                  "AGE <= 25:",
                  age_ok
              )

              print(
                  "WALK <= 15:",
                  walk_ok
              )

              print(
                  "OWNERSHIP:",
                  ownership_ok
              )

              print(
                  "ALL CONDITIONS:",
                  all_ok
              )

          print()
          print("=" * 70)
          print("DETAIL EXTRACTION TEST COMPLETE")
          print("=" * 70)

          PY

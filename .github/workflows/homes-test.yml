name: HOME'S Property Monitor

on:
  # 手動実行
  workflow_dispatch:
    inputs:
      reset_baseline:
        description: "現在の物件を基準として再登録する"
        required: true
        default: false
        type: boolean

  # 10分ごと
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

permissions:
  contents: write

concurrency:
  group: homes-property-monitor
  cancel-in-progress: false

jobs:
  monitor-homes:
    runs-on: ubuntu-latest

    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      RESET_BASELINE: ${{ github.event.inputs.reset_baseline || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan HOME'S and notify new properties
        run: |
          python - <<'PY'
          import re
          import html
          import json
          import time
          import urllib.parse
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone

          # ============================================================
          # 設定
          # ============================================================

          BASE_URL = "https://www.homes.co.jp"
          LIST_BASE_URL = "https://www.homes.co.jp/kodate/chuko/tokyo/list/"

          KNOWN_FILE = "known_homes_urls.txt"

          # 最大巡回ページ数
          MAX_LIST_PAGES = 8

          # 条件
          MAX_PRICE_MAN_YEN = 7000
          MIN_BUILDING_AREA_M2 = 70.0
          MAX_AGE_YEARS = 25.0
          MAX_WALK_MINUTES = 15

          TARGET_CITIES = {
              "中野区": "13114",
              "杉並区": "13115",
              "豊島区": "13116",
              "練馬区": "13120",
              "八王子市": "13201",
              "立川市": "13202",
              "武蔵野市": "13203",
              "三鷹市": "13204",
              "西東京市": "13229",
          }

          # HTTPリトライ
          DETAIL_RETRY_COUNT = 3
          DETAIL_RETRY_SECONDS = [2, 5, 10]

          USER_AGENT = (
              "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) "
              "AppleWebKit/605.1.15 (KHTML, like Gecko) "
              "Version/18.0 Mobile/15E148 Safari/604.1"
          )

          RESET_BASELINE = (
              str(__import__("os").environ.get("RESET_BASELINE", "false"))
              .lower()
              .strip()
              == "true"
          )

          NTFY_TOPIC = __import__("os").environ.get("NTFY_TOPIC", "").strip()

          # ============================================================
          # 共通関数
          # ============================================================

          def separator(title=None):
              print()
              print("=" * 70)
              if title:
                  print(title)
                  print("=" * 70)

          def normalize_space(s):
              if s is None:
                  return None
              s = html.unescape(s)
              s = re.sub(r"<[^>]+>", " ", s)
              s = re.sub(r"\s+", " ", s).strip()
              return s or None

          def fetch(url, timeout=30):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": USER_AGENT,
                      "Accept": (
                          "text/html,application/xhtml+xml,"
                          "application/xml;q=0.9,*/*;q=0.8"
                      ),
                      "Accept-Language": "ja,en-US;q=0.8,en;q=0.6",
                      "Cache-Control": "no-cache",
                  },
              )

              try:
                  with urllib.request.urlopen(req, timeout=timeout) as response:
                      raw = response.read()
                      charset = response.headers.get_content_charset() or "utf-8"
                      try:
                          text = raw.decode(charset, errors="replace")
                      except Exception:
                          text = raw.decode("utf-8", errors="replace")

                      return {
                          "status": response.status,
                          "url": response.geturl(),
                          "text": text,
                      }

              except urllib.error.HTTPError as e:
                  try:
                      raw = e.read()
                      text = raw.decode("utf-8", errors="replace")
                  except Exception:
                      text = ""

                  return {
                      "status": e.code,
                      "url": url,
                      "text": text,
                  }

              except Exception as e:
                  print(f"FETCH ERROR: {type(e).__name__}: {e}")
                  return {
                      "status": None,
                      "url": url,
                      "text": "",
                  }

          def build_list_url(page):
              params = []

              for code in TARGET_CITIES.values():
                  params.append((f"cond[city][{code}]", code))

              params.append(("cond[pref]", "13"))
              params.append(("cond[sortby]", "newdate"))

              if page > 1:
                  params.append(("page", str(page)))

              query = urllib.parse.urlencode(params)

              return LIST_BASE_URL + "?" + query

          def extract_property_urls(page_html):
              urls = set()

              # HOME'S中古戸建詳細URL
              patterns = [
                  r'href=["\'](https?://www\.homes\.co\.jp/kodate/b-\d+/?)["\']',
                  r'href=["\'](/kodate/b-\d+/?)["\']',
              ]

              for pattern in patterns:
                  for found in re.findall(
                      pattern,
                      page_html,
                      flags=re.IGNORECASE,
                  ):
                      found = html.unescape(found)

                      if found.startswith("/"):
                          found = BASE_URL + found

                      if not found.endswith("/"):
                          found += "/"

                      urls.add(found)

              return sorted(urls)

          def load_known_urls():
              try:
                  with open(KNOWN_FILE, "r", encoding="utf-8") as f:
                      return {
                          line.strip()
                          for line in f
                          if line.strip()
                      }
              except FileNotFoundError:
                  return set()

          def save_known_urls(urls):
              with open(KNOWN_FILE, "w", encoding="utf-8") as f:
                  for url in sorted(urls):
                      f.write(url + "\n")

          # ============================================================
          # 詳細ページ解析
          # ============================================================

          def extract_title(page_html):
              m = re.search(
                  r"<title[^>]*>(.*?)</title>",
                  page_html,
                  flags=re.IGNORECASE | re.DOTALL,
              )
              if not m:
                  return None

              title = normalize_space(m.group(1))

              if title:
                  title = re.sub(
                      r"\s*[-｜|]\s*HOME'S.*$",
                      "",
                      title,
                      flags=re.IGNORECASE,
                  )

              return title

          def extract_address(page_html):
              # JSON-LD等
              candidates = [
                  r'"address"\s*:\s*"([^"]+)"',
                  r'"streetAddress"\s*:\s*"([^"]+)"',
                  r'所在地[^<]{0,30}</[^>]+>\s*<[^>]+>(.*?)</',
              ]

              for pattern in candidates:
                  m = re.search(
                      pattern,
                      page_html,
                      flags=re.IGNORECASE | re.DOTALL,
                  )
                  if m:
                      value = normalize_space(m.group(1))
                      if value and "東京" in value:
                          return value

              # ページ全体テキストから住所
              text = normalize_space(page_html) or ""

              m = re.search(
                  r"(東京都(?:中野区|杉並区|豊島区|練馬区|"
                  r"八王子市|立川市|武蔵野市|三鷹市|西東京市)"
                  r"[^\s|｜]{0,40})",
                  text,
              )

              if m:
                  return m.group(1)

              return None

          def detect_city(address, title):
              source = " ".join(
                  x for x in [address, title] if x
              )

              for city in TARGET_CITIES:
                  if city in source:
                      return city

              return None

          def extract_price(page_html):
              text = normalize_space(page_html) or ""

              patterns = [
                  r"(?:販売価格|価格)[^\d]{0,30}"
                  r"([0-9,]+)\s*万円",
                  r'"price"\s*:\s*"?([0-9,]+)"?',
              ]

              for pattern in patterns:
                  m = re.search(pattern, text, flags=re.IGNORECASE)
                  if not m:
                      continue

                  raw = m.group(1).replace(",", "")

                  try:
                      value = float(raw)
                  except ValueError:
                      continue

                  # 円表記のJSON価格なら万円へ変換
                  if value > 100000:
                      value /= 10000

                  return round(value, 2)

              return None

          def extract_building_area(page_html):
              text = normalize_space(page_html) or ""

              patterns = [
                  r"(?:建物面積|延床面積)"
                  r"[^\d]{0,40}"
                  r"([0-9]+(?:\.[0-9]+)?)\s*"
                  r"(?:m2|m²|㎡)",
              ]

              for pattern in patterns:
                  m = re.search(
                      pattern,
                      text,
                      flags=re.IGNORECASE,
                  )
                  if m:
                      try:
                          return float(m.group(1))
                      except ValueError:
                          pass

              return None

          def extract_build_date(page_html):
              text = normalize_space(page_html) or ""

              patterns = [
                  r"(?:築年月|完成時期|建築年月)"
                  r"[^\d]{0,30}"
                  r"((?:19|20)\d{2})年"
                  r"\s*([0-9]{1,2})?月?",
              ]

              for pattern in patterns:
                  m = re.search(pattern, text)
                  if m:
                      year = int(m.group(1))
                      month = int(m.group(2)) if m.group(2) else 1
                      return year, month

              # yyyy/mm
              m = re.search(
                  r"(?:築年月|完成時期|建築年月)"
                  r"[^\d]{0,30}"
                  r"((?:19|20)\d{2})"
                  r"[/.-]"
                  r"([0-9]{1,2})",
                  text,
              )

              if m:
                  return int(m.group(1)), int(m.group(2))

              return None, None

          def calculate_age(year, month):
              if year is None:
                  return None

              now = datetime.now(timezone.utc)

              # JST日付相当に補正
              current_year = now.year
              current_month = now.month

              if month is None:
                  month = 1

              age_months = (
                  (current_year - year) * 12
                  + (current_month - month)
              )

              return round(age_months / 12.0, 1)

          def extract_land_right(page_html):
              text = normalize_space(page_html) or ""

              # 「土地権利：所有権」等
              patterns = [
                  r"(?:土地権利|権利形態)"
                  r"[^\S\r\n]*[:：]?"
                  r"[^\wぁ-んァ-ヶ一-龠]{0,10}"
                  r"(所有権|借地権|定期借地権|地上権)",
                  r"(所有権)",
              ]

              for pattern in patterns:
                  m = re.search(pattern, text)
                  if m:
                      return m.group(1)

              return None

          # ============================================================
          # 徒歩時間
          # ============================================================

          def extract_walk_from_title(title):
              if not title:
                  return [], "NOT_FOUND"

              # バス利用表記がある場合は
              # 「バス17分＋徒歩7分」を駅徒歩7分とは判定しない
              if re.search(r"バス\s*\d+\s*分", title):
                  return [], "BUS_ROUTE"

              minutes = []

              patterns = [
                  r"(?:駅|停留所|バス停)?\s*徒歩\s*(\d{1,3})\s*分",
                  r"徒歩\s*(\d{1,3})\s*分",
              ]

              for pattern in patterns:
                  for value in re.findall(pattern, title):
                      try:
                          minutes.append(int(value))
                      except ValueError:
                          pass

              minutes = [
                  x
                  for x in minutes
                  if 0 < x <= 120
              ]

              if minutes:
                  return sorted(set(minutes)), "TITLE_DIRECT_WALK"

              return [], "NOT_FOUND"

          def extract_walk_from_page(page_html):
              text = normalize_space(page_html) or ""

              # バスルートを除外して直接徒歩だけ拾う
              candidates = []

              patterns = [
                  r"(?:交通|アクセス|最寄り駅)"
                  r".{0,120}?"
                  r"(?:駅)?徒歩\s*(\d{1,3})\s*分",
              ]

              for pattern in patterns:
                  for m in re.finditer(
                      pattern,
                      text,
                      flags=re.DOTALL,
                  ):
                      snippet = m.group(0)

                      if re.search(
                          r"バス\s*\d+\s*分",
                          snippet
                      ):
                          continue

                      try:
                          candidates.append(
                              int(m.group(1))
                          )
                      except Exception:
                          pass

              candidates = [
                  x for x in candidates
                  if 0 < x <= 120
              ]

              if candidates:
                  return sorted(set(candidates)), "PAGE_DIRECT_WALK"

              return [], "NOT_FOUND"

          def extract_walk(title, page_html):
              minutes, source = extract_walk_from_title(title)

              if minutes:
                  return minutes, min(minutes), source

              # タイトルにバス経路がある場合は
              # 誤って別の徒歩数字を採用しない
              if source == "BUS_ROUTE":
                  return [], None, "BUS_ROUTE"

              minutes, source = extract_walk_from_page(page_html)

              if minutes:
                  return minutes, min(minutes), source

              return [], None, source

          # ============================================================
          # 詳細ページ取得
          # ============================================================

          def fetch_detail_with_retry(url):
              last_result = None

              for attempt in range(DETAIL_RETRY_COUNT):
                  result = fetch(url)
                  last_result = result

                  status = result["status"]

                  if status == 200 and result["text"]:
                      return result

                  # HOME'Sが一時的に返すことのある202
                  if status in (202, 429, 500, 502, 503, 504, None):
                      if attempt < DETAIL_RETRY_COUNT - 1:
                          wait = DETAIL_RETRY_SECONDS[
                              min(
                                  attempt,
                                  len(DETAIL_RETRY_SECONDS) - 1
                              )
                          ]

                          print(
                              f"DETAIL TEMPORARILY UNAVAILABLE "
                              f"(HTTP {status}). "
                              f"RETRY IN {wait}s."
                          )

                          time.sleep(wait)
                          continue

                  break

              return last_result

          # ============================================================
          # 物件解析
          # ============================================================

          def parse_property(url):
              result = fetch_detail_with_retry(url)

              if not result:
                  return {
                      "url": url,
                      "status": None,
                      "parse_complete": False,
                  }

              status = result["status"]
              page_html = result["text"]

              if status != 200 or not page_html:
                  return {
                      "url": url,
                      "status": status,
                      "parse_complete": False,
                  }

              title = extract_title(page_html)
              address = extract_address(page_html)
              city = detect_city(address, title)

              price = extract_price(page_html)
              area = extract_building_area(page_html)

              build_year, build_month = extract_build_date(page_html)
              age = calculate_age(build_year, build_month)

              walk_values, min_walk, walk_source = extract_walk(
                  title,
                  page_html,
              )

              land_right = extract_land_right(page_html)

              # --------------------------------------------------------
              # 各条件
              # --------------------------------------------------------

              city_ok = (
                  city in TARGET_CITIES
                  if city is not None
                  else False
              )

              price_ok = (
                  price is not None
                  and price <= MAX_PRICE_MAN_YEN
              )

              area_ok = (
                  area is not None
                  and area >= MIN_BUILDING_AREA_M2
              )

              age_ok = (
                  age is not None
                  and age <= MAX_AGE_YEARS
              )

              walk_ok = (
                  min_walk is not None
                  and min_walk <= MAX_WALK_MINUTES
              )

              ownership_ok = (
                  land_right == "所有権"
              )

              # 判定に必要なデータが全部取れているか
              parse_complete = all([
                  title is not None,
                  city is not None,
                  price is not None,
                  area is not None,
                  age is not None,
                  min_walk is not None or walk_source == "BUS_ROUTE",
                  land_right is not None,
              ])

              # BUS_ROUTE は「駅徒歩15分以内」ではないので
              # 徒歩条件Falseとして確定判定可能
              if walk_source == "BUS_ROUTE":
                  walk_ok = False

              all_conditions = all([
                  city_ok,
                  price_ok,
                  area_ok,
                  age_ok,
                  walk_ok,
                  ownership_ok,
              ])

              return {
                  "url": url,
                  "status": status,
                  "title": title,
                  "address": address,
                  "city": city,
                  "price": price,
                  "area": area,
                  "build_year": build_year,
                  "build_month": build_month,
                  "age": age,
                  "walk_values": walk_values,
                  "min_walk": min_walk,
                  "walk_source": walk_source,
                  "land_right": land_right,

                  "city_ok": city_ok,
                  "price_ok": price_ok,
                  "area_ok": area_ok,
                  "age_ok": age_ok,
                  "walk_ok": walk_ok,
                  "ownership_ok": ownership_ok,

                  "all_conditions": all_conditions,
                  "parse_complete": parse_complete,
              }

          # ============================================================
          # 通知
          # ============================================================

          def notify_ntfy(prop):
              if not NTFY_TOPIC:
                  print("NTFY_TOPIC is empty.")
                  print("NOTIFICATION SKIPPED.")
                  return False

              title = prop.get("title") or "HOME'S 新着中古戸建"

              message_lines = [
                  "🏠 HOME'S 新着中古戸建",
                  "",
                  f"エリア：{prop.get('city')}",
                  f"価格：{prop.get('price')}万円",
                  f"建物面積：{prop.get('area')}㎡",
                  f"築年数：約{prop.get('age')}年",
                  f"駅徒歩：{prop.get('min_walk')}分",
                  f"土地権利：{prop.get('land_right')}",
              ]

              if prop.get("address"):
                  message_lines.append(
                      f"所在地：{prop.get('address')}"
                  )

              message = "\n".join(message_lines)

              data = json.dumps(
                  {
                      "topic": NTFY_TOPIC,
                      "title": "🏠 HOME'S 新着中古戸建",
                      "message": message,
                      "priority": 5,
                      "tags": ["house"],
                      "click": prop["url"],
                  },
                  ensure_ascii=False,
              ).encode("utf-8")

              req = urllib.request.Request(
                  "https://ntfy.sh",
                  data=data,
                  headers={
                      "Content-Type": "application/json; charset=utf-8"
                  },
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(
                      req,
                      timeout=30,
                  ) as response:

                      ok = 200 <= response.status < 300

                      print(
                          f"NTFY HTTP STATUS: "
                          f"{response.status}"
                      )

                      return ok

              except Exception as e:
                  print(
                      f"NTFY ERROR: "
                      f"{type(e).__name__}: {e}"
                  )
                  return False

          # ============================================================
          # メイン
          # ============================================================

          separator("HOME'S PROPERTY MONITOR START")

          print("TARGET CITIES:")
          for city, code in TARGET_CITIES.items():
              print(f"  {city}: {code}")

          print()
          print("CONDITIONS:")
          print(f"  PRICE <= {MAX_PRICE_MAN_YEN}万円")
          print(f"  BUILDING AREA >= {MIN_BUILDING_AREA_M2}㎡")
          print(f"  AGE <= {MAX_AGE_YEARS} years")
          print(f"  WALK <= {MAX_WALK_MINUTES} minutes")
          print("  LAND RIGHT = 所有権")
          print(f"  LIST PAGES <= {MAX_LIST_PAGES}")

          known_urls = load_known_urls()

          print()
          print(f"RESET BASELINE: {RESET_BASELINE}")
          print(f"KNOWN URL COUNT: {len(known_urls)}")

          # ============================================================
          # 一覧ページ取得
          # ============================================================

          current_urls = set()
          successfully_scanned_pages = 0
          list_scan_interrupted = False

          for page in range(1, MAX_LIST_PAGES + 1):

              separator(f"FETCH LIST PAGE: {page}")

              list_url = build_list_url(page)

              print()
              print("LIST URL:")
              print(list_url)

              result = fetch(list_url)

              status = result["status"]

              print(f"HTTP STATUS: {status}")

              # --------------------------------------------------------
              # 一時的な202等
              #
              # ★今回の重要修正
              # ここまで取得済みの物件は捨てない
              # --------------------------------------------------------

              if status in (202, 429, 500, 502, 503, 504, None):

                  print(
                      "LIST PAGE TEMPORARILY UNAVAILABLE."
                  )

                  print(
                      "STOP PAGINATION AND PROCESS "
                      "ALREADY FETCHED PROPERTIES."
                  )

                  list_scan_interrupted = True
                  break

              if status != 200:
                  print(
                      "UNEXPECTED LIST HTTP STATUS."
                  )
                  print(
                      "STOP PAGINATION AND PROCESS "
                      "ALREADY FETCHED PROPERTIES."
                  )

                  list_scan_interrupted = True
                  break

              property_urls = extract_property_urls(
                  result["text"]
              )

              print(
                  f"PROPERTY URL COUNT: "
                  f"{len(property_urls)}"
              )

              before_count = len(current_urls)

              current_urls.update(property_urls)

              added_count = (
                  len(current_urls) - before_count
              )

              print(f"UNIQUE ADDED: {added_count}")

              for i, url in enumerate(
                  property_urls[:5],
                  start=1,
              ):
                  print(f"  SAMPLE {i}:")
                  print(f"  {url}")

              successfully_scanned_pages += 1

              # 物件なしなら正常な最終ページ
              if not property_urls:
                  print(
                      "NO PROPERTY URL. "
                      "NORMAL END OF PAGINATION."
                  )
                  break

              # 同一ページを繰り返している場合
              if added_count == 0:
                  print(
                      "NO NEW UNIQUE URL ON THIS PAGE."
                  )
                  print(
                      "PAGINATION APPEARS TO HAVE ENDED."
                  )
                  break

              # 30件未満程度なら最終ページの可能性大だが、
              # HOME'Sは件数変動があるので
              # ここでは自動停止せず次ページを確認する

              time.sleep(0.5)

          separator("LIST SCAN RESULT")

          print(
              f"SUCCESSFULLY SCANNED PAGES: "
              f"{successfully_scanned_pages}"
          )

          print(
              f"CURRENT URL COUNT: "
              f"{len(current_urls)}"
          )

          print(
              f"LIST SCAN INTERRUPTED: "
              f"{list_scan_interrupted}"
          )

          # 1ページ目すら取得できなかった
          if successfully_scanned_pages == 0:
              print()
              print(
                  "NO LIST PAGE WAS SUCCESSFULLY FETCHED."
              )
              print(
                  "KNOWN URL FILE WILL NOT BE CHANGED."
              )
              print(
                  "THE NEXT SCHEDULED RUN WILL RETRY."
              )

              separator(
                  "HOME'S PROPERTY MONITOR COMPLETE"
              )

              raise SystemExit(0)

          # ============================================================
          # ベースライン再登録
          # ============================================================

          if RESET_BASELINE:

              separator("BASELINE RESET")

              # 取得できたURLは登録
              # ただし既存knownは絶対に削除しない
              new_known = known_urls | current_urls

              save_known_urls(new_known)

              print(
                  f"CURRENT FETCHED URL COUNT: "
                  f"{len(current_urls)}"
              )

              print(
                  f"REGISTERED URL COUNT: "
                  f"{len(new_known)}"
              )

              if list_scan_interrupted:
                  print()
                  print(
                      "NOTE: LIST SCAN WAS INTERRUPTED."
                  )
                  print(
                      "EXISTING KNOWN URLS WERE PRESERVED."
                  )
                  print(
                      "FETCHED URLS WERE ADDED ONLY."
                  )

              print(
                  "No notification will be sent."
              )

              separator(
                  "HOME'S PROPERTY MONITOR COMPLETE"
              )

              raise SystemExit(0)

          # ============================================================
          # 新規URL抽出
          # ============================================================

          new_urls = sorted(
              current_urls - known_urls
          )

          print()
          print(
              f"NEW URL COUNT: "
              f"{len(new_urls)}"
          )

          if not new_urls:
              print("NO NEW PROPERTY URL.")

              if list_scan_interrupted:
                  print()
                  print(
                      "LIST SCAN WAS PARTIAL, "
                      "BUT FETCHED PAGES CONTAINED "
                      "NO UNKNOWN URL."
                  )

              separator(
                  "HOME'S PROPERTY MONITOR COMPLETE"
              )

              raise SystemExit(0)

          # ============================================================
          # 新規物件を詳細確認
          # ============================================================

          processed_count = 0
          notified_count = 0
          excluded_count = 0
          retry_count = 0

          updated_known_urls = set(known_urls)

          for index, url in enumerate(
              new_urls,
              start=1,
          ):

              separator(
                  f"NEW PROPERTY {index}"
              )

              print(f"URL: {url}")

              prop = parse_property(url)

              print(
                  f"HTTP STATUS: "
                  f"{prop.get('status')}"
              )

              print(
                  f"TITLE: "
                  f"{prop.get('title')}"
              )

              print(
                  f"ADDRESS: "
                  f"{prop.get('address')}"
              )

              print(
                  f"CITY: "
                  f"{prop.get('city')}"
              )

              print(
                  f"PRICE_MAN_YEN: "
                  f"{prop.get('price')}"
              )

              print(
                  f"BUILDING_AREA_M2: "
                  f"{prop.get('area')}"
              )

              print(
                  f"BUILD_YEAR: "
                  f"{prop.get('build_year')}"
              )

              print(
                  f"BUILD_MONTH: "
                  f"{prop.get('build_month')}"
              )

              print(
                  f"AGE_YEARS: "
                  f"{prop.get('age')}"
              )

              print(
                  f"WALKING_MINUTES_FOUND: "
                  f"{prop.get('walk_values')}"
              )

              print(
                  f"MIN_WALK_MINUTES: "
                  f"{prop.get('min_walk')}"
              )

              print(
                  f"WALK_SOURCE: "
                  f"{prop.get('walk_source')}"
              )

              print(
                  f"LAND_RIGHT: "
                  f"{prop.get('land_right')}"
              )

              print()
              print("CONDITION CHECK")
              print("-" * 70)

              print(
                  f"TARGET CITY: "
                  f"{prop.get('city_ok', False)}"
              )

              print(
                  f"PRICE <= 7000: "
                  f"{prop.get('price_ok', False)}"
              )

              print(
                  f"BUILDING AREA >= 70: "
                  f"{prop.get('area_ok', False)}"
              )

              print(
                  f"AGE <= 25: "
                  f"{prop.get('age_ok', False)}"
              )

              print(
                  f"WALK <= 15: "
                  f"{prop.get('walk_ok', False)}"
              )

              print(
                  f"OWNERSHIP: "
                  f"{prop.get('ownership_ok', False)}"
              )

              print(
                  f"ALL CONDITIONS: "
                  f"{prop.get('all_conditions', False)}"
              )

              # --------------------------------------------------------
              # 解析不完全
              #
              # ★knownへ入れない
              # → 次回再試行
              # --------------------------------------------------------

              if not prop.get(
                  "parse_complete",
                  False,
              ):

                  print("PARSING INCOMPLETE")

                  print(
                      "This URL remains "
                      "unregistered for retry."
                  )

                  retry_count += 1

                  time.sleep(0.5)
                  continue

              processed_count += 1

              # --------------------------------------------------------
              # 条件外
              #
              # 判定できているのでknownへ登録
              # --------------------------------------------------------

              if not prop["all_conditions"]:

                  print("EXCLUDED BY CONDITIONS")

                  updated_known_urls.add(url)

                  excluded_count += 1

                  time.sleep(0.5)
                  continue

              # --------------------------------------------------------
              # 条件適合 → 通知
              # --------------------------------------------------------

              print("MATCHED ALL CONDITIONS")
              print("SENDING NOTIFICATION...")

              notification_ok = notify_ntfy(prop)

              if notification_ok:
                  print("NOTIFICATION SUCCESS")

                  updated_known_urls.add(url)

                  notified_count += 1

              else:
                  # 通知失敗時もknownに入れない
                  # → 次回通知を再試行
                  print("NOTIFICATION FAILED")

                  print(
                      "This URL remains "
                      "unregistered for retry."
                  )

                  retry_count += 1

              time.sleep(0.5)

          # ============================================================
          # known保存
          # ============================================================

          # 重要：
          # existing known は一切削除しない
          #
          # 条件外と確定したもの
          # ＋通知成功したもの
          # だけを追加
          save_known_urls(updated_known_urls)

          separator("MONITOR RESULT")

          print(
              f"CURRENT URL COUNT: "
              f"{len(current_urls)}"
          )

          print(
              f"NEW URL COUNT: "
              f"{len(new_urls)}"
          )

          print(
              f"PROCESSED COUNT: "
              f"{processed_count}"
          )

          print(
              f"NOTIFIED COUNT: "
              f"{notified_count}"
          )

          print(
              f"EXCLUDED COUNT: "
              f"{excluded_count}"
          )

          print(
              f"RETRY COUNT: "
              f"{retry_count}"
          )

          print(
              f"KNOWN URL COUNT: "
              f"{len(updated_known_urls)}"
          )

          if list_scan_interrupted:
              print()
              print(
                  "LIST SCAN WAS INTERRUPTED, "
                  "BUT SUCCESSFULLY FETCHED PAGES "
                  "WERE PROCESSED."
              )

              print(
                  "NO EXISTING KNOWN URL "
                  "WAS REMOVED."
              )

              print(
                  "THE NEXT SCHEDULED RUN "
                  "WILL RETRY THE REMAINING PAGES."
              )

          separator(
              "HOME'S PROPERTY MONITOR COMPLETE"
          )

          PY

      - name: Save known HOME'S property URLs
        run: |
          if [ -f known_homes_urls.txt ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add known_homes_urls.txt

            if git diff --cached --quiet; then
              echo "No changes to known_homes_urls.txt"
              exit 0
            fi

            git commit -m "Update known HOME'S property URLs"

            # 定期実行中に他のcommitが入った場合に備える
            git pull --rebase origin main

            git push origin main
          else
            echo "known_homes_urls.txt does not exist."
          fi

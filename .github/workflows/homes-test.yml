name: HOME'S Investigation Test

on:
  workflow_dispatch:

jobs:
  investigate-homes:
    runs-on: ubuntu-latest

    steps:
      - name: Investigate HOME'S search structure
        run: |
          python - <<'PY'
          import re
          import html
          import urllib.parse
          import urllib.request

          # --------------------------------------------------
          # 対象9市区
          # --------------------------------------------------
          cities = {
              "中野区": "13114",
              "杉並区": "13115",
              "豊島区": "13116",
              "練馬区": "13120",
              "八王子市": "13201",
              "立川市": "13202",
              "武蔵野市": "13203",
              "三鷹市": "13204",
              "西東京市": "13229",
          }

          base_url = "https://www.homes.co.jp/kodate/chuko/tokyo/list/"

          params = []

          for city_name, city_code in cities.items():
              params.append(
                  (f"cond[city][{city_code}]", city_code)
              )

          # 東京都
          params.append(("cond[pref]", "13"))

          query = urllib.parse.urlencode(params)

          url = base_url + "?" + query

          print("=" * 70)
          print("HOME'S INVESTIGATION START")
          print("=" * 70)

          print()
          print("TARGET CITIES:")
          for city_name, city_code in cities.items():
              print(f"  {city_name}: {city_code}")

          print()
          print("REQUEST URL:")
          print(url)

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) "
                  "AppleWebKit/605.1.15 "
                  "(KHTML, like Gecko) Version/18.0 Mobile/15E148 Safari/604.1"
              ),
              "Accept": (
                  "text/html,application/xhtml+xml,application/xml;"
                  "q=0.9,*/*;q=0.8"
              ),
              "Accept-Language": "ja-JP,ja;q=0.9,en-US;q=0.5",
              "Connection": "close",
          }

          req = urllib.request.Request(
              url,
              headers=headers
          )

          try:
              with urllib.request.urlopen(
                  req,
                  timeout=30
              ) as response:

                  status = response.status
                  final_url = response.geturl()

                  raw = response.read()

          except Exception as e:
              print()
              print("FETCH ERROR:")
              print(repr(e))
              raise

          text = raw.decode(
              "utf-8",
              errors="ignore"
          )

          print()
          print("=" * 70)
          print("HTTP RESULT")
          print("=" * 70)

          print("HTTP STATUS:", status)
          print("FINAL URL:", final_url)
          print("HTML SIZE:", len(text))

          if status != 200:
              raise SystemExit(
                  f"HOME'S returned HTTP {status}"
              )

          # --------------------------------------------------
          # 物件詳細URLを抽出
          # --------------------------------------------------

          absolute_urls = re.findall(
              r'https?://(?:www\.)?homes\.co\.jp/kodate/b-[^"\'<>\s?#]+/?',
              text
          )

          relative_urls = re.findall(
              r'["\'](/kodate/b-[^"\'<>\s?#]+/?)["\']',
              text
          )

          property_urls = set()

          for u in absolute_urls:
              property_urls.add(
                  u.rstrip("/") + "/"
              )

          for u in relative_urls:
              property_urls.add(
                  "https://www.homes.co.jp"
                  + u.rstrip("/")
                  + "/"
              )

          property_urls = sorted(
              property_urls
          )

          print()
          print("=" * 70)
          print("PROPERTY URL TEST")
          print("=" * 70)

          print(
              "PROPERTY URL COUNT:",
              len(property_urls)
          )

          for i, property_url in enumerate(
              property_urls[:30],
              1
          ):
              print(
                  f"{i:02d}: {property_url}"
              )

          # --------------------------------------------------
          # HOME'Sの検索フォーム内部パラメータを調査
          # --------------------------------------------------

          names = re.findall(
              r'name=["\']([^"\']+)["\']',
              text,
              flags=re.I
          )

          cond_names = sorted({
              html.unescape(name)
              for name in names
              if "cond[" in html.unescape(name)
          })

          print()
          print("=" * 70)
          print("CONDITION PARAMETER INVESTIGATION")
          print("=" * 70)

          print(
              "COND PARAMETER COUNT:",
              len(cond_names)
          )

          for name in cond_names:
              print(name)

          # --------------------------------------------------
          # 条件に関係しそうなHTML断片を探す
          # --------------------------------------------------

          keywords = [
              "価格",
              "徒歩",
              "築年数",
              "築",
              "建物面積",
              "所有権",
              "土地権利",
              "7000",
              "70㎡",
              "70m",
          ]

          print()
          print("=" * 70)
          print("KEYWORD INVESTIGATION")
          print("=" * 70)

          clean_text = re.sub(
              r"\s+",
              " ",
              text
          )

          for keyword in keywords:

              position = clean_text.find(
                  keyword
              )

              print()
              print(
                  f"--- KEYWORD: {keyword} ---"
              )

              if position == -1:
                  print("NOT FOUND")
                  continue

              start = max(
                  0,
                  position - 300
              )

              end = min(
                  len(clean_text),
                  position + 500
              )

              snippet = clean_text[
                  start:end
              ]

              print(
                  snippet
              )

          # --------------------------------------------------
          # ページ数候補
          # --------------------------------------------------

          page_numbers = {
              int(x)
              for x in re.findall(
                  r'(?:[?&]|&amp;)page=(\d+)',
                  text
              )
          }

          print()
          print("=" * 70)
          print("PAGINATION TEST")
          print("=" * 70)

          if page_numbers:
              print(
                  "PAGE NUMBERS FOUND:",
                  sorted(page_numbers)
              )
              print(
                  "MAX PAGE:",
                  max(page_numbers)
              )
          else:
              print(
                  "NO PAGE PARAMETER DETECTED"
              )

          print()
          print("=" * 70)
          print("INVESTIGATION RESULT")
          print("=" * 70)

          print(
              "HTTP_OK:",
              status == 200
          )

          print(
              "PROPERTY_LINKS_FOUND:",
              len(property_urls) > 0
          )

          print(
              "PROPERTY_URL_COUNT:",
              len(property_urls)
          )

          print(
              "COND_PARAMETER_COUNT:",
              len(cond_names)
          )

          if len(property_urls) == 0:
              print()
              print(
                  "WARNING: No property detail URLs were found."
              )
              print(
                  "HOME'S may be rendering listings dynamically "
                  "or may use another URL pattern."
              )

          print()
          print(
              "HOME'S INVESTIGATION COMPLETE"
          )

          PY

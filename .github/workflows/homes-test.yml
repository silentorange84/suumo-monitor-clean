name: HOME'S Property Monitor

on:
  workflow_dispatch:
    inputs:
      reset_baseline:
        description: "現在の物件を基準として再登録する"
        required: true
        default: false
        type: boolean
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

permissions:
  contents: write

concurrency:
  group: homes-property-monitor
  cancel-in-progress: false

jobs:
  monitor-homes:
    runs-on: ubuntu-latest
    env:
      NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
      RESET_BASELINE: ${{ github.event.inputs.reset_baseline || 'false' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan HOME'S and notify
        run: |
          python - <<'PY'
          import os
          import re
          import html
          import json
          import time
          import urllib.parse
          import urllib.request
          import urllib.error
          from datetime import datetime, timezone

          BASE_URL = "https://www.homes.co.jp"
          LIST_BASE_URL = "https://www.homes.co.jp/kodate/chuko/tokyo/list/"
          KNOWN_FILE = "known_homes_urls.txt"
          STATE_FILE = "known_homes_state.json"

          MAX_LIST_PAGES = 8
          PRICE_CHECK_BATCH_SIZE = 20

          MAX_PRICE_MAN_YEN = 7000
          MIN_BUILDING_AREA_M2 = 70.0
          MAX_AGE_YEARS = 25.0
          MAX_WALK_MINUTES = 15

          TARGET_CITIES = {
              "中野区": "13114",
              "杉並区": "13115",
              "豊島区": "13116",
              "練馬区": "13120",
              "八王子市": "13201",
              "立川市": "13202",
              "武蔵野市": "13203",
              "三鷹市": "13204",
              "西東京市": "13229",
          }

          RETRYABLE = {202, 408, 425, 429, 500, 502, 503, 504, None}
          RETRY_WAITS = [2, 5, 10]

          USER_AGENT = (
              "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) "
              "AppleWebKit/605.1.15 (KHTML, like Gecko) "
              "Version/18.0 Mobile/15E148 Safari/604.1"
          )

          RESET_BASELINE = (
              os.environ.get("RESET_BASELINE", "false")
              .lower()
              .strip()
              == "true"
          )

          NTFY_TOPIC = os.environ.get("NTFY_TOPIC", "").strip()

          def sep(title):
              print()
              print("=" * 70)
              print(title)
              print("=" * 70)

          def clean(s):
              if s is None:
                  return None

              s = html.unescape(s)
              s = re.sub(r"<[^>]+>", " ", s)
              s = re.sub(r"\s+", " ", s).strip()

              return s or None

          def fetch_once(url, timeout=30):
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": USER_AGENT,
                      "Accept": (
                          "text/html,application/xhtml+xml,"
                          "application/xml;q=0.9,*/*;q=0.8"
                      ),
                      "Accept-Language": "ja,en-US;q=0.8,en;q=0.6",
                      "Cache-Control": "no-cache",
                  },
              )

              try:
                  with urllib.request.urlopen(
                      req,
                      timeout=timeout,
                  ) as r:

                      raw = r.read()

                      charset = (
                          r.headers.get_content_charset()
                          or "utf-8"
                      )

                      return {
                          "status": r.status,
                          "url": r.geturl(),
                          "text": raw.decode(
                              charset,
                              errors="replace",
                          ),
                      }

              except urllib.error.HTTPError as e:
                  try:
                      body = e.read().decode(
                          "utf-8",
                          errors="replace",
                      )
                  except Exception:
                      body = ""

                  return {
                      "status": e.code,
                      "url": url,
                      "text": body,
                  }

              except Exception as e:
                  print(
                      f"FETCH ERROR: "
                      f"{type(e).__name__}: {e}"
                  )

                  return {
                      "status": None,
                      "url": url,
                      "text": "",
                  }

          def fetch_with_retry(url, label):
              last = None

              for attempt in range(len(RETRY_WAITS)):

                  last = fetch_once(url)

                  status = last["status"]

                  if status == 200 and last["text"]:
                      return last

                  if status not in RETRYABLE:
                      return last

                  if attempt < len(RETRY_WAITS) - 1:

                      wait = RETRY_WAITS[attempt]

                      print(
                          f"{label} TEMPORARY ERROR "
                          f"HTTP={status}; "
                          f"retry in {wait}s"
                      )

                      time.sleep(wait)

              return last

          def build_list_url(page):
              params = [
                  (f"cond[city][{code}]", code)
                  for code in TARGET_CITIES.values()
              ]

              params += [
                  ("cond[pref]", "13"),
                  ("cond[sortby]", "newdate"),
              ]

              if page > 1:
                  params.append(
                      ("page", str(page))
                  )

              return (
                  LIST_BASE_URL
                  + "?"
                  + urllib.parse.urlencode(params)
              )

          def extract_property_urls(text):
              urls = set()

              patterns = [
                  (
                      r'href=["\']'
                      r'(https?://www\.homes\.co\.jp/'
                      r'kodate/b-\d+/?)'
                  ),
                  (
                      r'href=["\']'
                      r'(/kodate/b-\d+/?)'
                  ),
              ]

              for pattern in patterns:

                  for found in re.findall(
                      pattern,
                      text,
                      flags=re.IGNORECASE,
                  ):

                      found = html.unescape(found)

                      if found.startswith("/"):
                          found = BASE_URL + found

                      if not found.endswith("/"):
                          found += "/"

                      urls.add(found)

              return sorted(urls)

          def load_known():
              try:
                  with open(
                      KNOWN_FILE,
                      encoding="utf-8",
                  ) as f:

                      return {
                          line.strip()
                          for line in f
                          if line.strip()
                      }

              except FileNotFoundError:
                  return set()

          def save_known(urls):
              with open(
                  KNOWN_FILE,
                  "w",
                  encoding="utf-8",
              ) as f:

                  for url in sorted(urls):
                      f.write(url + "\n")

          def load_state():
              try:
                  with open(
                      STATE_FILE,
                      encoding="utf-8",
                  ) as f:

                      state = json.load(f)

              except (
                  FileNotFoundError,
                  json.JSONDecodeError,
              ):
                  state = {}

              if not isinstance(state, dict):
                  state = {}

              state.setdefault("_meta", {})
              state.setdefault("properties", {})

              state["_meta"].setdefault(
                  "price_cursor",
                  0,
              )

              return state

          def save_state(state):
              with open(
                  STATE_FILE,
                  "w",
                  encoding="utf-8",
              ) as f:

                  json.dump(
                      state,
                      f,
                      ensure_ascii=False,
                      indent=2,
                      sort_keys=True,
                  )

                  f.write("\n")

          def extract_title(text):
              m = re.search(
                  r"<title[^>]*>(.*?)</title>",
                  text,
                  flags=(
                      re.IGNORECASE
                      | re.DOTALL
                  ),
              )

              if not m:
                  return None

              title = clean(m.group(1))

              if title:
                  title = re.sub(
                      r"\s*[-｜|]\s*HOME'S.*$",
                      "",
                      title,
                      flags=re.IGNORECASE,
                  )

              return title

          def extract_address(text):
              patterns = [
                  (
                      r'"streetAddress"'
                      r'\s*:\s*"([^"]+)"'
                  ),
                  (
                      r'"address"'
                      r'\s*:\s*"([^"]+)"'
                  ),
              ]

              for pattern in patterns:

                  m = re.search(
                      pattern,
                      text,
                      flags=(
                          re.IGNORECASE
                          | re.DOTALL
                      ),
                  )

                  if m:
                      value = clean(m.group(1))

                      if (
                          value
                          and "東京" in value
                      ):
                          return value

              page_text = clean(text) or ""

              cities = "|".join(
                  map(
                      re.escape,
                      TARGET_CITIES,
                  )
              )

              m = re.search(
                  rf"(東京都(?:{cities})"
                  rf"[^\s|｜]{{0,40}})",
                  page_text,
              )

              if m:
                  return m.group(1)

              return None

          def detect_city(address, title):
              source = " ".join(
                  x
                  for x in [
                      address,
                      title,
                  ]
                  if x
              )

              for city in TARGET_CITIES:
                  if city in source:
                      return city

              return None

          def extract_price(text):
              page_text = clean(text) or ""

              patterns = [
                  (
                      r"(?:販売価格|価格)"
                      r"[^\d]{0,30}"
                      r"([0-9,]+(?:\.[0-9]+)?)"
                      r"\s*万円"
                  ),
                  (
                      r'"price"\s*:\s*"?'
                      r'([0-9,]+(?:\.[0-9]+)?)'
                      r'"?'
                  ),
              ]

              for pattern in patterns:

                  m = re.search(
                      pattern,
                      page_text,
                      flags=re.IGNORECASE,
                  )

                  if not m:
                      continue

                  try:
                      value = float(
                          m.group(1).replace(
                              ",",
                              "",
                          )
                      )

                  except ValueError:
                      continue

                  if value > 100000:
                      value /= 10000

                  return round(
                      value,
                      2,
                  )

              return None

          def extract_area(text):
              page_text = clean(text) or ""

              m = re.search(
                  (
                      r"(?:建物面積|延床面積)"
                      r"[^\d]{0,40}"
                      r"([0-9]+(?:\.[0-9]+)?)"
                      r"\s*(?:m2|m²|㎡)"
                  ),
                  page_text,
                  flags=re.IGNORECASE,
              )

              if m:
                  return float(m.group(1))

              return None

          def extract_build_date(text):
              page_text = clean(text) or ""

              m = re.search(
                  (
                      r"(?:築年月|完成時期|建築年月)"
                      r"[^\d]{0,30}"
                      r"((?:19|20)\d{2})年"
                      r"\s*([0-9]{1,2})?月?"
                  ),
                  page_text,
              )

              if m:
                  return (
                      int(m.group(1)),
                      int(m.group(2) or 1),
                  )

              m = re.search(
                  (
                      r"(?:築年月|完成時期|建築年月)"
                      r"[^\d]{0,30}"
                      r"((?:19|20)\d{2})"
                      r"[/.-]"
                      r"([0-9]{1,2})"
                  ),
                  page_text,
              )

              if m:
                  return (
                      int(m.group(1)),
                      int(m.group(2)),
                  )

              return None, None

          def age_years(year, month):
              if year is None:
                  return None

              now = datetime.now(
                  timezone.utc
              )

              months = (
                  (now.year - year) * 12
                  + (
                      now.month
                      - (month or 1)
                  )
              )

              return round(
                  months / 12.0,
                  1,
              )

          def extract_land_right(text):
              page_text = clean(text) or ""

              m = re.search(
                  (
                      r"(?:土地権利|権利形態)"
                      r"[^\n]{0,30}?"
                      r"(所有権|借地権|"
                      r"定期借地権|地上権)"
                  ),
                  page_text,
              )

              if m:
                  return m.group(1)

              if "所有権" in page_text:
                  return "所有権"

              return None

          def extract_walk(title, text):
              if (
                  title
                  and re.search(
                      r"バス\s*\d+\s*分",
                      title,
                  )
              ):
                  return (
                      [],
                      None,
                      "BUS_ROUTE",
                  )

              values = []

              if title:
                  values += [
                      int(x)
                      for x in re.findall(
                          r"徒歩\s*(\d{1,3})\s*分",
                          title,
                      )
                  ]

              values = [
                  x
                  for x in values
                  if 0 < x <= 120
              ]

              if values:
                  values = sorted(
                      set(values)
                  )

                  return (
                      values,
                      min(values),
                      "TITLE_DIRECT_WALK",
                  )

              page_text = clean(text) or ""

              for match in re.finditer(
                  (
                      r"(?:交通|アクセス|最寄り駅)"
                      r".{0,120}?"
                      r"(?:駅)?徒歩\s*"
                      r"(\d{1,3})\s*分"
                  ),
                  page_text,
                  flags=re.DOTALL,
              ):

                  snippet = match.group(0)

                  if re.search(
                      r"バス\s*\d+\s*分",
                      snippet,
                  ):
                      continue

                  values.append(
                      int(match.group(1))
                  )

              values = sorted(
                  set(
                      x
                      for x in values
                      if 0 < x <= 120
                  )
              )

              if values:
                  return (
                      values,
                      min(values),
                      "PAGE_DIRECT_WALK",
                  )

              return (
                  [],
                  None,
                  "NOT_FOUND",
              )

          def parse_property(url):
              result = fetch_with_retry(
                  url,
                  "DETAIL",
              )

              if (
                  not result
                  or result["status"] != 200
                  or not result["text"]
              ):
                  return {
                      "url": url,
                      "status": (
                          None
                          if not result
                          else result["status"]
                      ),
                      "parse_complete": False,
                  }

              text = result["text"]

              title = extract_title(text)

              address = extract_address(text)

              city = detect_city(
                  address,
                  title,
              )

              price = extract_price(text)

              area = extract_area(text)

              build_year, build_month = (
                  extract_build_date(text)
              )

              age = age_years(
                  build_year,
                  build_month,
              )

              (
                  walk_values,
                  min_walk,
                  walk_source,
              ) = extract_walk(
                  title,
                  text,
              )

              land_right = (
                  extract_land_right(text)
              )

              city_ok = (
                  city in TARGET_CITIES
                  if city
                  else False
              )

              price_ok = (
                  price is not None
                  and price
                  <= MAX_PRICE_MAN_YEN
              )

              area_ok = (
                  area is not None
                  and area
                  >= MIN_BUILDING_AREA_M2
              )

              age_ok = (
                  age is not None
                  and age
                  <= MAX_AGE_YEARS
              )

              walk_ok = (
                  min_walk is not None
                  and min_walk
                  <= MAX_WALK_MINUTES
              )

              ownership_ok = (
                  land_right == "所有権"
              )

              if walk_source == "BUS_ROUTE":
                  walk_ok = False

              parse_complete = all([
                  title is not None,
                  city is not None,
                  price is not None,
                  area is not None,
                  age is not None,
                  (
                      min_walk is not None
                      or walk_source
                      == "BUS_ROUTE"
                  ),
                  land_right is not None,
              ])

              all_conditions = all([
                  city_ok,
                  price_ok,
                  area_ok,
                  age_ok,
                  walk_ok,
                  ownership_ok,
              ])

              return {
                  "url": url,
                  "status": result["status"],
                  "title": title,
                  "address": address,
                  "city": city,
                  "price": price,
                  "area": area,
                  "build_year": build_year,
                  "build_month": build_month,
                  "age": age,
                  "walk_values": walk_values,
                  "min_walk": min_walk,
                  "walk_source": walk_source,
                  "land_right": land_right,
                  "city_ok": city_ok,
                  "price_ok": price_ok,
                  "area_ok": area_ok,
                  "age_ok": age_ok,
                  "walk_ok": walk_ok,
                  "ownership_ok": ownership_ok,
                  "all_conditions": all_conditions,
                  "parse_complete": (
                      parse_complete
                  ),
              }

          def update_state(state, prop):
              url = prop.get("url")
              price = prop.get("price")

              if (
                  not url
                  or price is None
              ):
                  return

              state["properties"][url] = {
                  "price": price,
                  "title": prop.get("title"),
                  "address": prop.get("address"),
                  "city": prop.get("city"),
                  "area": prop.get("area"),
                  "age": prop.get("age"),
                  "min_walk": (
                      prop.get("min_walk")
                  ),
                  "land_right": (
                      prop.get("land_right")
                  ),
                  "updated_at": (
                      datetime.now(
                          timezone.utc
                      ).isoformat()
                  ),
              }

          def send_ntfy(
              prop,
              kind="new",
              old_price=None,
          ):

              if not NTFY_TOPIC:
                  print(
                      "NTFY_TOPIC is empty; "
                      "notification skipped"
                  )
                  return False

              if kind == "drop":

                  drop = round(
                      float(old_price)
                      - float(prop["price"]),
                      2,
                  )

                  ntfy_title = (
                      "📉 HOME'S 値下げ中古戸建"
                  )

                  lines = [
                      "📉 HOME'S 値下げ中古戸建",
                      "",
                      (
                          f"エリア："
                          f"{prop['city']}"
                      ),
                      (
                          f"価格："
                          f"{old_price}万円 "
                          f"→ {prop['price']}万円"
                      ),
                      (
                          f"値下げ："
                          f"{drop}万円"
                      ),
                      (
                          f"建物面積："
                          f"{prop['area']}㎡"
                      ),
                      (
                          f"築年数：約"
                          f"{prop['age']}年"
                      ),
                      (
                          f"駅徒歩："
                          f"{prop['min_walk']}分"
                      ),
                      (
                          f"土地権利："
                          f"{prop['land_right']}"
                      ),
                  ]

              else:

                  ntfy_title = (
                      "🏠 HOME'S 新着中古戸建"
                  )

                  lines = [
                      "🏠 HOME'S 新着中古戸建",
                      "",
                      (
                          f"エリア："
                          f"{prop['city']}"
                      ),
                      (
                          f"価格："
                          f"{prop['price']}万円"
                      ),
                      (
                          f"建物面積："
                          f"{prop['area']}㎡"
                      ),
                      (
                          f"築年数：約"
                          f"{prop['age']}年"
                      ),
                      (
                          f"駅徒歩："
                          f"{prop['min_walk']}分"
                      ),
                      (
                          f"土地権利："
                          f"{prop['land_right']}"
                      ),
                  ]

              if prop.get("address"):
                  lines.append(
                      f"所在地："
                      f"{prop['address']}"
                  )

              body = json.dumps(
                  {
                      "topic": NTFY_TOPIC,
                      "title": ntfy_title,
                      "message": "\n".join(
                          lines
                      ),
                      "priority": 5,
                      "tags": ["house"],
                      "click": prop["url"],
                  },
                  ensure_ascii=False,
              ).encode("utf-8")

              req = urllib.request.Request(
                  "https://ntfy.sh",
                  data=body,
                  headers={
                      "Content-Type": (
                          "application/json; "
                          "charset=utf-8"
                      )
                  },
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(
                      req,
                      timeout=30,
                  ) as response:

                      print(
                          f"NTFY HTTP STATUS: "
                          f"{response.status}"
                      )

                      return (
                          200
                          <= response.status
                          < 300
                      )

              except Exception as e:
                  print(
                      f"NTFY ERROR: "
                      f"{type(e).__name__}: {e}"
                  )

                  return False

          sep(
              "HOME'S PROPERTY MONITOR START"
          )

          known = load_known()
          state = load_state()

          print(
              f"RESET BASELINE: "
              f"{RESET_BASELINE}"
          )

          print(
              f"KNOWN URL COUNT: "
              f"{len(known)}"
          )

          current = set()

          successful_pages = 0
          interrupted = False

          for page in range(
              1,
              MAX_LIST_PAGES + 1,
          ):

              sep(
                  f"FETCH LIST PAGE: {page}"
              )

              list_url = build_list_url(
                  page
              )

              print(list_url)

              result = fetch_with_retry(
                  list_url,
                  "LIST",
              )

              status = (
                  None
                  if not result
                  else result["status"]
              )

              print(
                  f"HTTP STATUS: "
                  f"{status}"
              )

              if (
                  not result
                  or status != 200
                  or not result["text"]
              ):

                  print(
                      "LIST PAGE UNAVAILABLE "
                      "AFTER RETRIES; "
                      "stop pagination"
                  )

                  interrupted = True
                  break

              property_urls = (
                  extract_property_urls(
                      result["text"]
                  )
              )

              before_count = len(current)

              current.update(
                  property_urls
              )

              added_count = (
                  len(current)
                  - before_count
              )

              successful_pages += 1

              print(
                  f"PROPERTY URL COUNT: "
                  f"{len(property_urls)}"
              )

              print(
                  f"UNIQUE ADDED: "
                  f"{added_count}"
              )

              if not property_urls:
                  print(
                      "NO PROPERTY URL; "
                      "normal end of pagination"
                  )
                  break

              if added_count == 0:
                  print(
                      "NO NEW UNIQUE URL; "
                      "pagination appears ended"
                  )
                  break

              time.sleep(0.5)

          sep("LIST SCAN RESULT")

          print(
              f"SUCCESSFULLY SCANNED PAGES: "
              f"{successful_pages}"
          )

          print(
              f"CURRENT URL COUNT: "
              f"{len(current)}"
          )

          print(
              f"LIST SCAN INTERRUPTED: "
              f"{interrupted}"
          )

          if successful_pages == 0:

              print(
                  "No list page succeeded. "
                  "Keep existing state and "
                  "retry next run."
              )

              raise SystemExit(0)

          if RESET_BASELINE:

              new_known = (
                  known
                  | current
              )

              save_known(
                  new_known
              )

              save_state(
                  state
              )

              print(
                  f"REGISTERED URL COUNT: "
                  f"{len(new_known)}"
              )

              print(
                  "No notification will be sent. "
                  "Price baselines initialize "
                  "gradually."
              )

              raise SystemExit(0)

          new_urls = sorted(
              current - known
          )

          print(
              f"NEW URL COUNT: "
              f"{len(new_urls)}"
          )

          updated_known = set(
              known
          )

          processed = 0
          notified = 0
          excluded = 0
          retry = 0

          for index, url in enumerate(
              new_urls,
              1,
          ):

              sep(
                  f"NEW PROPERTY {index}"
              )

              prop = parse_property(
                  url
              )

              print(
                  f"URL: {url}"
              )

              print(
                  f"HTTP STATUS: "
                  f"{prop.get('status')}"
              )

              print(
                  f"TITLE: "
                  f"{prop.get('title')}"
              )

              print(
                  f"PRICE_MAN_YEN: "
                  f"{prop.get('price')}"
              )

              print(
                  f"BUILDING_AREA_M2: "
                  f"{prop.get('area')}"
              )

              print(
                  f"AGE_YEARS: "
                  f"{prop.get('age')}"
              )

              print(
                  f"MIN_WALK_MINUTES: "
                  f"{prop.get('min_walk')}"
              )

              print(
                  f"LAND_RIGHT: "
                  f"{prop.get('land_right')}"
              )

              print(
                  f"ALL CONDITIONS: "
                  f"{prop.get('all_conditions', False)}"
              )

              if not prop.get(
                  "parse_complete"
              ):

                  print(
                      "PARSING INCOMPLETE; "
                      "leave unregistered "
                      "for retry"
                  )

                  retry += 1
                  continue

              processed += 1

              if not prop[
                  "all_conditions"
              ]:

                  print(
                      "EXCLUDED BY CONDITIONS"
                  )

                  updated_known.add(
                      url
                  )

                  update_state(
                      state,
                      prop,
                  )

                  excluded += 1
                  continue

              notification_ok = (
                  send_ntfy(
                      prop,
                      "new",
                  )
              )

              if notification_ok:

                  print(
                      "NEW PROPERTY "
                      "NOTIFICATION SUCCESS"
                  )

                  updated_known.add(
                      url
                  )

                  update_state(
                      state,
                      prop,
                  )

                  notified += 1

              else:

                  print(
                      "NOTIFICATION FAILED; "
                      "leave unregistered "
                      "for retry"
                  )

                  retry += 1

          sep(
              "PRICE DROP MONITOR"
          )

          price_candidates = sorted(
              (
                  updated_known
                  & current
              )
              - set(new_urls)
          )

          cursor = int(
              state
              .get("_meta", {})
              .get(
                  "price_cursor",
                  0,
              )
              or 0
          )

          if price_candidates:

              cursor %= len(
                  price_candidates
              )

              batch = (
                  price_candidates[
                      cursor:
                  ]
                  + price_candidates[
                      :cursor
                  ]
              )[
                  :PRICE_CHECK_BATCH_SIZE
              ]

              next_cursor = (
                  cursor
                  + len(batch)
              ) % len(
                  price_candidates
              )

          else:
              batch = []
              next_cursor = 0

          print(
              f"PRICE CHECK "
              f"CANDIDATE COUNT: "
              f"{len(price_candidates)}"
          )

          print(
              f"PRICE CHECK "
              f"BATCH COUNT: "
              f"{len(batch)}"
          )

          price_checked = 0
          price_init = 0
          price_drops = 0
          price_drop_notified = 0
          price_retry = 0

          for index, url in enumerate(
              batch,
              1,
          ):

              sep(
                  f"PRICE CHECK {index}"
              )

              prop = parse_property(
                  url
              )

              if not prop.get(
                  "parse_complete"
              ):

                  print(
                      "PRICE CHECK "
                      "PARSING INCOMPLETE; "
                      "keep previous price"
                  )

                  price_retry += 1
                  continue

              price_checked += 1

              old_price = (
                  state["properties"]
                  .get(url, {})
                  .get("price")
              )

              new_price = prop.get(
                  "price"
              )

              print(
                  f"PREVIOUS PRICE: "
                  f"{old_price}"
              )

              print(
                  f"CURRENT PRICE: "
                  f"{new_price}"
              )

              if old_price is None:

                  print(
                      "PRICE BASELINE "
                      "INITIALIZED WITHOUT "
                      "NOTIFICATION"
                  )

                  update_state(
                      state,
                      prop,
                  )

                  price_init += 1
                  continue

              try:
                  old_price = float(
                      old_price
                  )

                  new_price = float(
                      new_price
                  )

              except (
                  TypeError,
                  ValueError,
              ):

                  update_state(
                      state,
                      prop,
                  )

                  continue

              if new_price < old_price:

                  price_drops += 1

                  print(
                      f"PRICE DROP DETECTED: "
                      f"{old_price} "
                      f"-> {new_price}"
                  )

                  if prop[
                      "all_conditions"
                  ]:

                      notification_ok = (
                          send_ntfy(
                              prop,
                              "drop",
                              old_price,
                          )
                      )

                      if notification_ok:

                          print(
                              "PRICE DROP "
                              "NOTIFICATION "
                              "SUCCESS"
                          )

                          update_state(
                              state,
                              prop,
                          )

                          price_drop_notified += 1

                      else:

                          print(
                              "PRICE DROP "
                              "NOTIFICATION FAILED; "
                              "keep old price "
                              "for retry"
                          )

                          price_retry += 1

                  else:

                      print(
                          "PRICE DROPPED "
                          "BUT STILL OUTSIDE "
                          "CONDITIONS"
                      )

                      update_state(
                          state,
                          prop,
                      )

              else:

                  update_state(
                      state,
                      prop,
                  )

          state["_meta"][
              "price_cursor"
          ] = next_cursor

          save_known(
              updated_known
          )

          save_state(
              state
          )

          sep("MONITOR RESULT")

          print(
              f"CURRENT URL COUNT: "
              f"{len(current)}"
          )

          print(
              f"NEW URL COUNT: "
              f"{len(new_urls)}"
          )

          print(
              f"PROCESSED COUNT: "
              f"{processed}"
          )

          print(
              f"NOTIFIED COUNT: "
              f"{notified}"
          )

          print(
              f"EXCLUDED COUNT: "
              f"{excluded}"
          )

          print(
              f"RETRY COUNT: "
              f"{retry}"
          )

          print(
              f"KNOWN URL COUNT: "
              f"{len(updated_known)}"
          )

          print(
              f"PRICE CHECKED COUNT: "
              f"{price_checked}"
          )

          print(
              f"PRICE BASELINE "
              f"INITIALIZED COUNT: "
              f"{price_init}"
          )

          print(
              f"PRICE DROP COUNT: "
              f"{price_drops}"
          )

          print(
              f"PRICE DROP "
              f"NOTIFIED COUNT: "
              f"{price_drop_notified}"
          )

          print(
              f"PRICE CHECK "
              f"RETRY COUNT: "
              f"{price_retry}"
          )

          if interrupted:

              print(
                  "LIST SCAN WAS PARTIAL; "
                  "fetched pages were "
                  "processed and existing "
                  "known URLs were preserved."
              )

          sep(
              "HOME'S PROPERTY MONITOR COMPLETE"
          )

          PY

      - name: Save HOME'S monitor state
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          [ -f known_homes_urls.txt ] && git add known_homes_urls.txt
          [ -f known_homes_state.json ] && git add known_homes_state.json

          if git diff --cached --quiet; then
            echo "No HOME'S monitor state changes."
            exit 0
          fi

          git commit -m "Update HOME'S monitor state"
          git pull --rebase origin main
          git push origin main

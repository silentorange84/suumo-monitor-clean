name: HOME'S New Property Monitor

on:
  workflow_dispatch:
    inputs:
      reset_baseline:
        description: "現在の物件を基準として再登録する"
        required: true
        default: false
        type: boolean

  # SUUMO版と同じ10分間隔
  schedule:
    - cron: "3,13,23,33,43,53 * * * *"

permissions:
  contents: write

concurrency:
  group: homes-property-monitor
  cancel-in-progress: false

jobs:
  monitor-homes:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Scan HOME'S and notify new properties
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          RESET_BASELINE: ${{ inputs.reset_baseline || false }}

        run: |
          python - <<'PY'
          import os
          import re
          import html
          import json
          import time
          import urllib.parse
          import urllib.request
          import urllib.error
          from pathlib import Path
          from datetime import datetime


          # ============================================================
          # 基本設定
          # ============================================================

          BASE_URL = "https://www.homes.co.jp"
          LIST_URL = "https://www.homes.co.jp/kodate/chuko/tokyo/list/"

          KNOWN_FILE = Path("known_homes_urls.txt")

          MAX_LIST_PAGES = 8
          REQUEST_TIMEOUT = 25
          REQUEST_RETRIES = 3
          REQUEST_INTERVAL = 0.5

          MAX_PRICE_MAN_YEN = 7000
          MIN_BUILDING_AREA_M2 = 70.0
          MAX_AGE_YEARS = 25.0
          MAX_WALK_MINUTES = 15

          TARGET_CITIES = {
              "中野区": "13114",
              "杉並区": "13115",
              "豊島区": "13116",
              "練馬区": "13120",
              "八王子市": "13201",
              "立川市": "13202",
              "武蔵野市": "13203",
              "三鷹市": "13204",
              "西東京市": "13229",
          }

          USER_AGENT = (
              "Mozilla/5.0 (iPhone; CPU iPhone OS 18_0 like Mac OS X) "
              "AppleWebKit/605.1.15 (KHTML, like Gecko) "
              "Version/18.0 Mobile/15E148 Safari/604.1"
          )

          RESET_BASELINE = (
              str(os.environ.get("RESET_BASELINE", "false"))
              .strip()
              .lower()
              in {"1", "true", "yes", "on"}
          )

          NTFY_TOPIC = os.environ.get("NTFY_TOPIC", "").strip()


          # ============================================================
          # 汎用関数
          # ============================================================

          def separator():
              print("=" * 70)


          def normalize_space(value):
              if value is None:
                  return None

              value = html.unescape(str(value))
              value = value.replace("\u3000", " ")
              value = value.replace("\xa0", " ")
              value = re.sub(r"\s+", " ", value)

              return value.strip()


          def strip_tags(source):
              if not source:
                  return ""

              text = re.sub(
                  r"<script\b[^>]*>.*?</script>",
                  " ",
                  source,
                  flags=re.I | re.S,
              )

              text = re.sub(
                  r"<style\b[^>]*>.*?</style>",
                  " ",
                  text,
                  flags=re.I | re.S,
              )

              text = re.sub(r"<[^>]+>", " ", text)
              text = html.unescape(text)
              text = text.replace("\u3000", " ")
              text = text.replace("\xa0", " ")
              text = re.sub(r"\s+", " ", text)

              return text.strip()


          def fetch_url(url):
              last_error = None

              for attempt in range(1, REQUEST_RETRIES + 1):

                  try:
                      request = urllib.request.Request(
                          url,
                          headers={
                              "User-Agent": USER_AGENT,
                              "Accept": (
                                  "text/html,application/xhtml+xml,"
                                  "application/xml;q=0.9,*/*;q=0.8"
                              ),
                              "Accept-Language": "ja-JP,ja;q=0.9,en-US;q=0.7,en;q=0.5",
                              "Cache-Control": "no-cache",
                          },
                      )

                      with urllib.request.urlopen(
                          request,
                          timeout=REQUEST_TIMEOUT,
                      ) as response:

                          status = response.status

                          raw = response.read()

                          charset = (
                              response.headers.get_content_charset()
                              or "utf-8"
                          )

                          try:
                              source = raw.decode(charset)
                          except Exception:
                              source = raw.decode(
                                  "utf-8",
                                  errors="replace",
                              )

                          final_url = response.geturl()

                          return {
                              "ok": True,
                              "status": status,
                              "html": source,
                              "final_url": final_url,
                              "error": None,
                          }

                  except Exception as exc:
                      last_error = str(exc)

                      print(
                          f"FETCH ERROR "
                          f"attempt={attempt}/{REQUEST_RETRIES}: "
                          f"{last_error}"
                      )

                      if attempt < REQUEST_RETRIES:
                          time.sleep(attempt * 2)

              return {
                  "ok": False,
                  "status": None,
                  "html": "",
                  "final_url": url,
                  "error": last_error,
              }


          # ============================================================
          # HOME'S 検索URL
          # ============================================================

          def build_list_url(page=1):

              params = []

              for city_code in TARGET_CITIES.values():
                  params.append(
                      (
                          f"cond[city][{city_code}]",
                          city_code,
                      )
                  )

              params.append(("cond[pref]", "13"))

              # 新着順を明示
              params.append(("cond[sortby]", "newdate"))

              if page > 1:
                  params.append(("page", str(page)))

              query = urllib.parse.urlencode(
                  params,
                  doseq=True,
              )

              return LIST_URL + "?" + query


          # ============================================================
          # 一覧ページ → 物件URL抽出
          # ============================================================

          def extract_property_urls(source):

              found = set()

              if not source:
                  return found

              decoded = html.unescape(source)

              # --------------------------------------------------------
              # 重要：
              # HOME'S は多くの物件リンクを
              #
              # /kodate/b-xxxxxxxxxxxx/
              #
              # の相対URLで出す。
              #
              # 以前の実運用版で2件しか拾えなかった主因候補。
              # --------------------------------------------------------

              patterns = [

                  # 相対URL
                  r'''href\s*=\s*["'](
                      /kodate/b-[A-Za-z0-9_-]+/?
                  )["']''',

                  # 絶対URL
                  r'''href\s*=\s*["'](
                      https?://www\.homes\.co\.jp/kodate/
                      b-[A-Za-z0-9_-]+/?
                  )["']''',

                  # HTML中に直接出るURLの保険
                  r'''(
                      https?://www\.homes\.co\.jp/kodate/
                      b-[A-Za-z0-9_-]+/?
                  )''',

                  # href以外の相対URLの保険
                  r'''(
                      /kodate/b-[A-Za-z0-9_-]+/
                  )''',
              ]

              for pattern in patterns:

                  matches = re.findall(
                      pattern,
                      decoded,
                      flags=re.I | re.X,
                  )

                  for value in matches:

                      value = html.unescape(value)
                      value = value.strip()

                      if value.startswith("/"):
                          value = BASE_URL + value

                      value = value.split("#", 1)[0]
                      value = value.split("?", 1)[0]

                      if not value.endswith("/"):
                          value += "/"

                      if re.match(
                          r"^https://www\.homes\.co\.jp/"
                          r"kodate/b-[A-Za-z0-9_-]+/$",
                          value,
                          re.I,
                      ):
                          found.add(value)

              return found


          # ============================================================
          # 詳細ページ抽出
          # ============================================================

          def extract_title(source):

              match = re.search(
                  r"<title[^>]*>(.*?)</title>",
                  source,
                  flags=re.I | re.S,
              )

              if not match:
                  return None

              return normalize_space(
                  strip_tags(match.group(1))
              )


          def extract_price(text):

              patterns = [
                  r"価格\s*[|：:]?\s*"
                  r"([0-9,]+)\s*万円",

                  r"([0-9,]+)\s*万円",
              ]

              for pattern in patterns:

                  match = re.search(pattern, text)

                  if match:

                      try:
                          return int(
                              match.group(1).replace(",", "")
                          )
                      except Exception:
                          pass

              return None


          def extract_building_area(text):

              patterns = [
                  r"建物面積\s*[|：:]?\s*"
                  r"([0-9]+(?:\.[0-9]+)?)\s*"
                  r"(?:㎡|m²|m2)",

                  r"建物面積[^0-9]{0,30}"
                  r"([0-9]+(?:\.[0-9]+)?)\s*"
                  r"(?:㎡|m²|m2)",
              ]

              for pattern in patterns:

                  match = re.search(
                      pattern,
                      text,
                      flags=re.I,
                  )

                  if match:

                      try:
                          return float(match.group(1))
                      except Exception:
                          pass

              return None


          def extract_build_date(text):

              patterns = [
                  r"築年月\s*[|：:]?\s*"
                  r"([12][0-9]{3})年\s*"
                  r"([0-9]{1,2})月",

                  r"建築年[^0-9]{0,20}"
                  r"([12][0-9]{3})年\s*"
                  r"([0-9]{1,2})月",
              ]

              for pattern in patterns:

                  match = re.search(pattern, text)

                  if match:

                      year = int(match.group(1))
                      month = int(match.group(2))

                      if 1 <= month <= 12:
                          return year, month

              # 月が取れない場合
              match = re.search(
                  r"(?:築年月|建築年)[^0-9]{0,20}"
                  r"([12][0-9]{3})年",
                  text,
              )

              if match:
                  return int(match.group(1)), None

              return None, None


          def calculate_age_years(year, month):

              if not year:
                  return None

              today = datetime.now()

              use_month = month or 1

              total_months = (
                  (today.year - year) * 12
                  + today.month
                  - use_month
              )

              if total_months < 0:
                  return 0.0

              return round(
                  total_months / 12.0,
                  1,
              )


          def extract_address(text):

              patterns = [
                  r"所在地\s*[|：:]?\s*"
                  r"(東京都[^|]{2,80}?)"
                  r"(?=\s+(?:交通|主要採光面|建物構造|土地面積|間取り))",

                  r"所在地\s*[|：:]?\s*"
                  r"(東京都[^\n]{2,80})",
              ]

              for pattern in patterns:

                  match = re.search(
                      pattern,
                      text,
                      flags=re.S,
                  )

                  if match:

                      value = normalize_space(match.group(1))

                      for stopword in [
                          "交通",
                          "主要採光面",
                          "建物構造",
                          "土地面積",
                          "間取り",
                      ]:

                          if stopword in value:
                              value = value.split(
                                  stopword,
                                  1,
                              )[0].strip()

                      return value

              # title 等からの保険
              match = re.search(
                  r"(東京都(?:"
                  + "|".join(
                      map(
                          re.escape,
                          TARGET_CITIES.keys(),
                      )
                  )
                  + r")[^\s|]{0,40})",
                  text,
              )

              if match:
                  return normalize_space(match.group(1))

              return None


          def detect_city(address, title, text):

              candidates = [
                  address or "",
                  title or "",
              ]

              # 本文全体は最後の保険
              candidates.append(text[:8000])

              for city in TARGET_CITIES:

                  for candidate in candidates:

                      if city in candidate:
                          return city

              return None


          def extract_land_right(text):

              patterns = [
                  r"土地権利\s*[|：:]?\s*"
                  r"([^\s|]{1,20})",

                  r"土地権利[^|]{0,20}"
                  r"(所有権|借地権|地上権)",
              ]

              for pattern in patterns:

                  match = re.search(pattern, text)

                  if match:
                      return normalize_space(
                          match.group(1)
                      )

              return None


          def extract_transport_section(text):

              # HOME'S の「物件概要」で
              # 所在地 → 交通 → 主要採光面
              # の順に出るケースを優先

              match = re.search(
                  r"所在地\s*[|：:]?.{0,200}?"
                  r"交通\s*[|：:]?\s*"
                  r"(.*?)"
                  r"(?=\s+(?:主要採光面|建物構造|接道状況|土地面積))",
                  text,
                  flags=re.S,
              )

              if match:
                  return normalize_space(
                      match.group(1)
                  )

              # 保険
              match = re.search(
                  r"交通\s*[|：:]?\s*(.{0,1000})",
                  text,
                  flags=re.S,
              )

              if match:
                  return normalize_space(
                      match.group(1)[:1000]
                  )

              return ""


          def extract_walk_minutes(title, text):

              title = normalize_space(title or "")
              transport = extract_transport_section(text)

              # --------------------------------------------------------
              # 1. title中の「駅 徒歩N分」を最優先
              #
              # 「駅 バス17分 ○○下車 徒歩7分」
              # は絶対に徒歩7分として扱わない。
              # --------------------------------------------------------

              direct_title = re.findall(
                  r"駅\s*徒歩\s*([0-9]{1,3})\s*分",
                  title,
              )

              if direct_title:

                  values = [
                      int(v)
                      for v in direct_title
                  ]

                  return (
                      min(values),
                      values,
                      "TITLE_DIRECT_WALK",
                  )

              # --------------------------------------------------------
              # 2. 交通欄の直徒歩
              # --------------------------------------------------------

              direct_transport = re.findall(
                  r"駅\s*徒歩\s*([0-9]{1,3})\s*分",
                  transport,
              )

              if direct_transport:

                  values = [
                      int(v)
                      for v in direct_transport
                  ]

                  return (
                      min(values),
                      values,
                      "TRANSPORT_DIRECT_WALK",
                  )

              # --------------------------------------------------------
              # 3. バス物件判定
              # --------------------------------------------------------

              bus_text = (
                  title + " " + transport
              )

              if re.search(
                  r"バス\s*[0-9]{1,3}\s*分",
                  bus_text,
              ):
                  return (
                      None,
                      [],
                      "BUS_ROUTE",
                  )

              return (
                  None,
                  [],
                  "NOT_FOUND",
              )


          def parse_property(url, source):

              title = extract_title(source)

              text = strip_tags(source)

              price = extract_price(text)

              building_area = extract_building_area(text)

              build_year, build_month = (
                  extract_build_date(text)
              )

              age_years = calculate_age_years(
                  build_year,
                  build_month,
              )

              address = extract_address(text)

              city = detect_city(
                  address,
                  title,
                  text,
              )

              land_right = extract_land_right(text)

              (
                  min_walk,
                  walks,
                  walk_source,
              ) = extract_walk_minutes(
                  title,
                  text,
              )

              return {
                  "url": url,
                  "title": title,
                  "address": address,
                  "city": city,
                  "price_man_yen": price,
                  "building_area_m2": building_area,
                  "build_year": build_year,
                  "build_month": build_month,
                  "age_years": age_years,
                  "walking_minutes_found": walks,
                  "min_walk_minutes": min_walk,
                  "walk_source": walk_source,
                  "land_right": land_right,
              }


          # ============================================================
          # 条件判定
          # ============================================================

          def check_conditions(data):

              target_city = (
                  data["city"]
                  in TARGET_CITIES
              )

              price_ok = (
                  data["price_man_yen"] is not None
                  and
                  data["price_man_yen"]
                  <= MAX_PRICE_MAN_YEN
              )

              building_ok = (
                  data["building_area_m2"]
                  is not None
                  and
                  data["building_area_m2"]
                  >= MIN_BUILDING_AREA_M2
              )

              age_ok = (
                  data["age_years"] is not None
                  and
                  data["age_years"]
                  <= MAX_AGE_YEARS
              )

              walk_ok = (
                  data["min_walk_minutes"]
                  is not None
                  and
                  data["min_walk_minutes"]
                  <= MAX_WALK_MINUTES
              )

              ownership_ok = (
                  data["land_right"]
                  is not None
                  and
                  "所有権"
                  in data["land_right"]
              )

              all_ok = all(
                  [
                      target_city,
                      price_ok,
                      building_ok,
                      age_ok,
                      walk_ok,
                      ownership_ok,
                  ]
              )

              return {
                  "target_city": target_city,
                  "price": price_ok,
                  "building_area": building_ok,
                  "age": age_ok,
                  "walk": walk_ok,
                  "ownership": ownership_ok,
                  "all": all_ok,
              }


          # ============================================================
          # ntfy
          # ============================================================

          def notify_ntfy(data):

              if not NTFY_TOPIC:

                  print(
                      "WARNING: NTFY_TOPIC is empty. "
                      "Notification skipped."
                  )

                  return False

              title_text = (
                  "HOME'S 新着中古戸建"
              )

              message_lines = [
                  f"エリア: {data['city'] or '不明'}",
                  f"価格: {data['price_man_yen']}万円",
                  f"建物面積: {data['building_area_m2']}㎡",
                  f"築年数: {data['age_years']}年",
                  f"駅徒歩: {data['min_walk_minutes']}分",
                  f"土地権利: {data['land_right']}",
                  "",
                  data["title"] or "HOME'S物件",
                  "",
                  data["url"],
              ]

              body = "\n".join(message_lines)

              topic_url = (
                  "https://ntfy.sh/"
                  + urllib.parse.quote(
                      NTFY_TOPIC,
                      safe="",
                  )
              )

              request = urllib.request.Request(
                  topic_url,
                  data=body.encode("utf-8"),
                  method="POST",
                  headers={
                      "Title": title_text,
                      "Priority": "high",
                      "Tags": "house",
                      "Content-Type": (
                          "text/plain; charset=utf-8"
                      ),
                  },
              )

              try:

                  with urllib.request.urlopen(
                      request,
                      timeout=20,
                  ) as response:

                      print(
                          "NTFY STATUS:",
                          response.status,
                      )

                      return (
                          200
                          <= response.status
                          < 300
                      )

              except Exception as exc:

                  print(
                      "NTFY ERROR:",
                      str(exc),
                  )

                  return False


          # ============================================================
          # known URL
          # ============================================================

          def load_known_urls():

              if not KNOWN_FILE.exists():
                  return set()

              urls = set()

              for line in KNOWN_FILE.read_text(
                  encoding="utf-8"
              ).splitlines():

                  value = line.strip()

                  if value:
                      urls.add(value)

              return urls


          def save_known_urls(urls):

              ordered = sorted(urls)

              content = ""

              if ordered:
                  content = (
                      "\n".join(ordered)
                      + "\n"
                  )

              KNOWN_FILE.write_text(
                  content,
                  encoding="utf-8",
              )


          # ============================================================
          # START
          # ============================================================

          separator()
          print("HOME'S PROPERTY MONITOR START")
          separator()

          print()

          print("TARGET CITIES:")

          for city, code in TARGET_CITIES.items():
              print(f"  {city}: {code}")

          print()

          print("CONDITIONS:")
          print(
              f"  PRICE <= "
              f"{MAX_PRICE_MAN_YEN}万円"
          )
          print(
              f"  BUILDING AREA >= "
              f"{MIN_BUILDING_AREA_M2}㎡"
          )
          print(
              f"  AGE <= "
              f"{MAX_AGE_YEARS} years"
          )
          print(
              f"  WALK <= "
              f"{MAX_WALK_MINUTES} minutes"
          )
          print(
              "  LAND RIGHT = 所有権"
          )
          print(
              f"  LIST PAGES <= "
              f"{MAX_LIST_PAGES}"
          )

          print()
          print(
              "RESET BASELINE:",
              RESET_BASELINE,
          )

          known_urls = load_known_urls()

          print(
              "KNOWN URL COUNT:",
              len(known_urls),
          )


          # ============================================================
          # 一覧巡回
          # ============================================================

          current_urls = set()

          for page in range(
              1,
              MAX_LIST_PAGES + 1,
          ):

              print()
              print("-" * 70)
              print(
                  f"FETCH LIST PAGE: {page}"
              )
              print("-" * 70)

              list_url = build_list_url(page)

              print(
                  "LIST URL:",
                  list_url,
              )

              result = fetch_url(list_url)

              print(
                  "HTTP STATUS:",
                  result["status"],
              )

              if not result["ok"]:

                  print(
                      "LIST FETCH FAILED:",
                      result["error"],
                  )

                  break

              page_urls = extract_property_urls(
                  result["html"]
              )

              before_count = len(current_urls)

              current_urls.update(
                  page_urls
              )

              unique_added = (
                  len(current_urls)
                  - before_count
              )

              print(
                  "PROPERTY URL COUNT:",
                  len(page_urls),
              )

              print(
                  "UNIQUE ADDED:",
                  unique_added,
              )

              # デバッグ用に先頭5件だけ表示
              for index, value in enumerate(
                  sorted(page_urls)[:5],
                  start=1,
              ):
                  print(
                      f"  SAMPLE {index}: "
                      f"{value}"
                  )

              if len(page_urls) == 0:

                  print(
                      "NO PROPERTY URL. "
                      "STOP PAGINATION."
                  )

                  break

              if page > 1 and unique_added == 0:

                  print(
                      "NO NEW UNIQUE URL. "
                      "STOP PAGINATION."
                  )

                  break

              time.sleep(
                  REQUEST_INTERVAL
              )


          # ============================================================
          # 一覧結果
          # ============================================================

          print()
          separator()
          print("LIST SCAN RESULT")
          separator()

          print(
              "CURRENT URL COUNT:",
              len(current_urls),
          )

          if len(current_urls) == 0:

              print(
                  "ERROR: No HOME'S property "
                  "URLs were extracted."
              )

              print(
                  "Known URL file will NOT "
                  "be overwritten."
              )

              raise SystemExit(1)


          # ============================================================
          # 基準再登録
          # ============================================================

          if RESET_BASELINE:

              save_known_urls(
                  current_urls
              )

              print()
              separator()
              print("BASELINE RESET")
              separator()

              print(
                  "REGISTERED URL COUNT:",
                  len(current_urls),
              )

              print(
                  "No notification will be sent."
              )

              print()
              separator()
              print(
                  "HOME'S PROPERTY MONITOR COMPLETE"
              )
              separator()

              raise SystemExit(0)


          # ============================================================
          # 新規URL
          # ============================================================

          new_urls = sorted(
              current_urls
              - known_urls
          )

          print(
              "NEW URL COUNT:",
              len(new_urls),
          )


          if not new_urls:

              print(
                  "NO NEW PROPERTY URL"
              )

              print()
              separator()
              print(
                  "HOME'S PROPERTY MONITOR COMPLETE"
              )
              separator()

              raise SystemExit(0)


          # ============================================================
          # 新規物件詳細確認
          # ============================================================

          notified_count = 0
          excluded_count = 0
          retry_count = 0

          processed_urls = set()

          for index, url in enumerate(
              new_urls,
              start=1,
          ):

              print()
              print("-" * 70)
              print(
                  f"NEW PROPERTY {index}"
              )
              print("-" * 70)

              print(
                  "URL:",
                  url,
              )

              result = fetch_url(url)

              print(
                  "HTTP STATUS:",
                  result["status"],
              )

              if not result["ok"]:

                  print(
                      "DETAIL FETCH FAILED"
                  )

                  print(
                      "This URL remains unregistered "
                      "and will be retried next run."
                  )

                  retry_count += 1

                  continue

              try:

                  data = parse_property(
                      url,
                      result["html"],
                  )

                  print(
                      "TITLE:",
                      data["title"],
                  )

                  print(
                      "ADDRESS:",
                      data["address"],
                  )

                  print(
                      "CITY:",
                      data["city"],
                  )

                  print(
                      "PRICE_MAN_YEN:",
                      data["price_man_yen"],
                  )

                  print(
                      "BUILDING_AREA_M2:",
                      data["building_area_m2"],
                  )

                  print(
                      "BUILD_YEAR:",
                      data["build_year"],
                  )

                  print(
                      "BUILD_MONTH:",
                      data["build_month"],
                  )

                  print(
                      "AGE_YEARS:",
                      data["age_years"],
                  )

                  print(
                      "WALKING_MINUTES_FOUND:",
                      data[
                          "walking_minutes_found"
                      ],
                  )

                  print(
                      "MIN_WALK_MINUTES:",
                      data[
                          "min_walk_minutes"
                      ],
                  )

                  print(
                      "WALK_SOURCE:",
                      data["walk_source"],
                  )

                  print(
                      "LAND_RIGHT:",
                      data["land_right"],
                  )


                  conditions = check_conditions(
                      data
                  )

                  print()
                  print("CONDITION CHECK")
                  print("-" * 70)

                  print(
                      "TARGET CITY:",
                      conditions["target_city"],
                  )

                  print(
                      "PRICE <= 7000:",
                      conditions["price"],
                  )

                  print(
                      "BUILDING AREA >= 70:",
                      conditions[
                          "building_area"
                      ],
                  )

                  print(
                      "AGE <= 25:",
                      conditions["age"],
                  )

                  print(
                      "WALK <= 15:",
                      conditions["walk"],
                  )

                  print(
                      "OWNERSHIP:",
                      conditions["ownership"],
                  )

                  print(
                      "ALL CONDITIONS:",
                      conditions["all"],
                  )


                  # ----------------------------------------
                  # 解析不能の場合は既知登録しない
                  # → 次回再試行
                  # ----------------------------------------

                  required_values_ok = all(
                      [
                          data["city"]
                          is not None,

                          data["price_man_yen"]
                          is not None,

                          data["building_area_m2"]
                          is not None,

                          data["age_years"]
                          is not None,

                          data["land_right"]
                          is not None,
                      ]
                  )

                  # 徒歩はバス物件なら
                  # Noneで正常判定できるため例外
                  if (
                      data["min_walk_minutes"]
                      is None
                      and
                      data["walk_source"]
                      not in {
                          "BUS_ROUTE",
                      }
                  ):
                      required_values_ok = False


                  if not required_values_ok:

                      print(
                          "PARSING INCOMPLETE"
                      )

                      print(
                          "This URL remains "
                          "unregistered for retry."
                      )

                      retry_count += 1

                      continue


                  # ----------------------------------------
                  # 条件一致
                  # ----------------------------------------

                  if conditions["all"]:

                      print()
                      print(
                          "MATCHED ALL CONDITIONS"
                      )

                      notified = notify_ntfy(
                          data
                      )

                      if notified:
                          print(
                              "NOTIFICATION SENT"
                          )

                          notified_count += 1

                          processed_urls.add(
                              url
                          )

                      else:
                          print(
                              "NOTIFICATION FAILED"
                          )

                          print(
                              "URL remains unregistered "
                              "for retry."
                          )

                          retry_count += 1


                  # ----------------------------------------
                  # 条件外
                  # ----------------------------------------

                  else:

                      print(
                          "EXCLUDED BY CONDITIONS"
                      )

                      excluded_count += 1

                      # 条件外物件は再確認不要
                      processed_urls.add(
                          url
                      )


              except Exception as exc:

                  print(
                      "DETAIL PARSE ERROR:",
                      str(exc),
                  )

                  print(
                      "URL remains unregistered "
                      "for retry."
                  )

                  retry_count += 1


              time.sleep(
                  REQUEST_INTERVAL
              )


          # ============================================================
          # known URL 更新
          # ============================================================

          updated_known_urls = (
              known_urls
              | processed_urls
          )

          save_known_urls(
              updated_known_urls
          )


          # ============================================================
          # 結果
          # ============================================================

          print()
          separator()
          print("MONITOR RESULT")
          separator()

          print(
              "CURRENT URL COUNT:",
              len(current_urls),
          )

          print(
              "NEW URL COUNT:",
              len(new_urls),
          )

          print(
              "PROCESSED COUNT:",
              len(processed_urls),
          )

          print(
              "NOTIFIED COUNT:",
              notified_count,
          )

          print(
              "EXCLUDED COUNT:",
              excluded_count,
          )

          print(
              "RETRY COUNT:",
              retry_count,
          )

          print(
              "KNOWN URL COUNT:",
              len(updated_known_urls),
          )

          print()
          separator()
          print(
              "HOME'S PROPERTY MONITOR COMPLETE"
          )
          separator()

          PY

      - name: Save known HOME'S property URLs
        run: |
          if git diff --quiet -- known_homes_urls.txt; then
            echo "No known URL changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add known_homes_urls.txt
          git commit -m "Update known HOME'S property URLs"
          git push

      - name: Complete job
        run: |
          echo "HOME'S monitor completed."

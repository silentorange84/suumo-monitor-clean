name: AtHome investigation test

on:
  # 調査専用。監視スケジュールや通知、既存データの更新は行わない。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  investigate-athome:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Investigate list, pagination, and property details
        env:
          # /kodate/ は新築・中古一戸建ての統合検索。kod=ko001（中古限定）は付けない。
          ATHOME_SEARCH_URL: "https://www.athome.co.jp/kodate/tokyo/list/?pref=13&cities=nakano,suginami,toshima,nerima,tachikawa,musashino,mitaka,nishitokyo&cityCds=13114,13115,13116,13120,13202,13203,13204,13229&basic=kb206,kb208,kp001,kp114,kt110,kt424,kf001,ke005,kn021,kj001&sort=33&limit=30&q=1"
        run: |
          python - <<'PY'
          import hashlib
          import html
          import json
          import os
          import re
          import sys
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          from html.parser import HTMLParser


          SEARCH_URL = os.environ["ATHOME_SEARCH_URL"]
          ORIGIN = "https://www.athome.co.jp"
          MAX_DETAIL_SAMPLES = 6
          DETAIL_REQUEST_INTERVAL_SECONDS = 3
          # 前回の制限応答は約 8,127 bytes。通常の詳細ページとして誤解析しない。
          MIN_DETAIL_PAGE_BYTES = 12_000

          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 (KHTML, like Gecko) "
                  "Chrome/140.0.0.0 Safari/537.36"
              ),
              "Accept": (
                  "text/html,application/xhtml+xml,application/xml;q=0.9,"
                  "image/avif,image/webp,*/*;q=0.8"
              ),
              "Accept-Language": "ja-JP,ja;q=0.9,en;q=0.7",
              "Cache-Control": "no-cache",
              "Pragma": "no-cache",
              "Upgrade-Insecure-Requests": "1",
          }


          def safe_text(value):
              """HTML由来の値を、正規表現や文字列操作に安全な文字列へ変換する。"""
              if value is None:
                  return ""
              if isinstance(value, (list, tuple, set)):
                  return " ".join(
                      part for item in value if (part := safe_text(item))
                  )
              if isinstance(value, bytes):
                  return value.decode("utf-8", errors="replace")
              return str(value)


          class LinkParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.links = []
                  self.current_link = None

              def finish_current_link(self):
                  if self.current_link is None:
                      return
                  self.current_link["text"] = re.sub(
                      r"\s+", " ", safe_text(self.current_link.get("text"))
                  ).strip()
                  self.current_link = None

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != "a":
                      return
                  # 壊れたHTMLで前の a が閉じないまま次の a が始まっても確定する。
                  self.finish_current_link()
                  values = dict(attrs)
                  href = safe_text(values.get("href"))
                  if href:
                      self.current_link = {
                          "href": href,
                          "rel": safe_text(values.get("rel")),
                          "class": safe_text(values.get("class")),
                          "onclick": safe_text(values.get("onclick")),
                          "data": {
                              name: safe_text(value) for name, value in attrs
                              if name.lower().startswith("data-")
                          },
                          "text": [],
                      }
                      self.links.append(self.current_link)

              def handle_data(self, data):
                  if self.current_link is not None:
                      self.current_link["text"].append(safe_text(data))

              def handle_endtag(self, tag):
                  if tag.lower() == "a":
                      self.finish_current_link()

              def close(self):
                  # EOFまで a が閉じられない不完全なHTMLでも text を list のまま残さない。
                  super().close()
                  self.finish_current_link()


          class StructuredFieldParser(HTMLParser):
              """table/dl のラベルと隣接値を、表示テキストの順序どおり収集する。"""

              TAGS = {"th", "td", "dt", "dd"}

              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack = []
                  self.items = []
                  self.group = 0
                  self.current_group = None

              def handle_starttag(self, tag, attrs):
                  tag = tag.lower()
                  if tag in {"tr", "dl"}:
                      self.group += 1
                      self.current_group = self.group
                  if tag in self.TAGS:
                      self.stack.append({
                          "tag": tag, "group": self.current_group, "text": []
                      })

              def handle_startendtag(self, tag, attrs):
                  return

              def handle_data(self, data):
                  if self.stack:
                      self.stack[-1]["text"].append(data)

              def handle_endtag(self, tag):
                  if not self.stack:
                      if tag.lower() in {"tr", "dl"}:
                          self.current_group = None
                      return
                  current = self.stack[-1]
                  if tag.lower() == current["tag"]:
                      current["text"] = re.sub(
                          r"\s+", " ", "".join(current["text"])
                      ).strip()
                      self.items.append(current)
                      self.stack.pop()
                  if tag.lower() in {"tr", "dl"}:
                      self.current_group = None


          class PaginationProbeParser(HTMLParser):
              """ページ送りに使われ得る form、イベント、data-* を収集する。"""

              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.forms = []
                  self.data_attributes = []
                  self.controls = []
                  self.current_form = None

              def handle_starttag(self, tag, attrs):
                  values = dict(attrs)
                  pagination_attributes = {
                      name: value for name, value in attrs
                      if name.lower() == "onclick" or name.lower().startswith("data-")
                  }
                  if pagination_attributes and re.search(
                      r"(?:next|次へ|page|pager|pagination|offset|cursor|2)",
                      json.dumps(pagination_attributes, ensure_ascii=False), re.I,
                  ):
                      self.controls.append({
                          "tag": tag,
                          "id": values.get("id", ""),
                          "class": values.get("class", ""),
                          "attributes": pagination_attributes,
                      })
                  if tag.lower() == "form":
                      self.current_form = {
                          "action": values.get("action", ""),
                          "method": values.get("method", "get").lower(),
                          "inputs": [],
                      }
                      self.forms.append(self.current_form)
                  elif tag.lower() == "input" and self.current_form is not None:
                      self.current_form["inputs"].append({
                          "name": values.get("name", ""),
                          "value": values.get("value", ""),
                          "type": values.get("type", ""),
                      })
                  for name, value in attrs:
                      if name.lower().startswith("data-") and re.search(
                          r"(?:page|pager|pagination|url|href|query|q)", name, re.I
                      ):
                          self.data_attributes.append({
                              "tag": tag,
                              "name": name,
                              "value": (value or "")[:300],
                          })

              def handle_endtag(self, tag):
                  if tag.lower() == "form":
                      self.current_form = None


          opener = urllib.request.build_opener(
              urllib.request.HTTPCookieProcessor()
          )


          def fetch(url):
              last_error = None
              for attempt in range(1, 3):
                  request = urllib.request.Request(url, headers=HEADERS)
                  try:
                      with opener.open(request, timeout=30) as response:
                          raw = response.read()
                          charset = response.headers.get_content_charset() or "utf-8"
                          return {
                              "status": response.status,
                              "final_url": response.geturl(),
                              "content_type": response.headers.get_content_type(),
                              "bytes": len(raw),
                              "sha256": hashlib.sha256(raw).hexdigest(),
                              "text": raw.decode(charset, errors="replace"),
                          }
                  except urllib.error.HTTPError as error:
                      body = error.read()
                      last_error = f"HTTP {error.code} ({len(body)} bytes)"
                      if error.code not in {408, 425, 429, 500, 502, 503, 504}:
                          break
                  except Exception as error:
                      last_error = f"{type(error).__name__}: {error}"
                  if attempt < 2:
                      time.sleep(3)
              return {"status": None, "error": last_error, "text": ""}


          def parse_links(page_html, base_url):
              parser = LinkParser()
              parser.feed(page_html)
              parser.close()
              result = []
              seen = set()
              for item in parser.links:
                  absolute = urllib.parse.urljoin(base_url, item["href"])
                  if absolute in seen:
                      continue
                  seen.add(absolute)
                  item = dict(item)
                  item["url"] = absolute
                  result.append(item)
              return result


          def property_urls(links):
              urls = []
              seen = set()
              patterns = (
                  r"^https://www\.athome\.co\.jp/kodate/\d+/?(?:[?#].*)?$",
                  r"^https://www\.athome\.co\.jp/kodate/chuko/\d+/?(?:[?#].*)?$",
              )
              for link in links:
                  url = link["url"]
                  if any(re.search(pattern, url, re.I) for pattern in patterns):
                      # 計測用クエリが違っても同じ物件として扱う。
                      canonical = urllib.parse.urlunsplit(
                          (*urllib.parse.urlsplit(url)[:3], "", "")
                      )
                      if canonical not in seen:
                          seen.add(canonical)
                          urls.append(canonical)
              return urls


          def pagination_candidates(links):
              candidates = []
              for link in links:
                  url = safe_text(link.get("url"))
                  rel = safe_text(link.get("rel")).lower()
                  css_class = safe_text(link.get("class")).lower()
                  link_text = safe_text(link.get("text"))
                  parts = urllib.parse.urlsplit(url)
                  query = urllib.parse.parse_qs(parts.query)
                  looks_like_page = (
                      "next" in rel
                      or "pager" in css_class
                      or re.search(r"(?:次へ|^2$|2ページ)", link_text)
                      or any(key in query for key in ("page", "p", "offset", "cursor"))
                  )
                  if (
                      looks_like_page
                      and parts.netloc.endswith("athome.co.jp")
                      and "/kodate/tokyo/list/" in parts.path
                  ):
                      candidates.append(url)
              return list(dict.fromkeys(candidates))


          def pagination_evidence(page_html, base_url):
              parser = PaginationProbeParser()
              parser.feed(page_html)
              relevant_forms = []
              for form in parser.forms:
                  encoded = json.dumps(form, ensure_ascii=False)
                  if re.search(r"(?:page|pager|pagination|offset|cursor|next)", encoded, re.I):
                      item = dict(form)
                      item["action"] = urllib.parse.urljoin(base_url, item["action"])
                      item["inputs"] = item["inputs"][:30]
                      relevant_forms.append(item)

              # script 全文は出さず、ページ送り/APIらしい記述の前後だけを出す。
              script_text = " ".join(re.findall(
                  r"<script\b[^>]*>(.*?)</script>", page_html, flags=re.I | re.S
              ))
              script_candidates = []
              for match in re.finditer(
                  r".{0,180}(?:page(?:No|Num|Index)?[\"']?\s*[:=]\s*[\"']?2|"
                  r"(?:next|pager|pagination|offset|cursor|fetch|ajax|xhr)).{0,180}",
                  script_text,
                  flags=re.I | re.S,
              ):
                  candidate = html.unescape(match.group(0))[:400]
                  if candidate not in script_candidates:
                      script_candidates.append(candidate)
              return {
                  "forms": relevant_forms[:10],
                  "data_attributes": parser.data_attributes[:30],
                  "pagination_controls": parser.controls[:30],
                  "script_and_api_candidates": script_candidates[:30],
                  "next_text_occurrences": len(re.findall(r">\s*次へ\s*<", page_html)),
                  "page_2_control_occurrences": len(re.findall(
                      r">\s*(?:2|2ページ目)\s*<", page_html
                  )),
              }


          def listing_type_candidates(page_html, properties):
              """詳細リンク周辺のカードHTMLだけから種別候補を推定する。"""
              buckets = {"新築一戸建て": [], "中古一戸建て": [], "不明": []}
              for url in properties:
                  path = urllib.parse.urlsplit(url).path.rstrip("/")
                  positions = [match.start() for match in re.finditer(
                      re.escape(path), page_html, flags=re.I
                  )]
                  snippets = [
                      text_content(page_html[max(0, pos - 2500):pos + 2500])
                      for pos in positions[:5]
                  ]
                  context = " ".join(snippets)
                  new_match = re.search(r"新築(?:一戸建て|戸建て|住宅)", context)
                  used_match = re.search(r"中古(?:一戸建て|戸建て|住宅)", context)
                  if "/kodate/chuko/" in url or (used_match and not new_match):
                      kind = "中古一戸建て"
                  elif "/kodate/shinchiku/" in url or (new_match and not used_match):
                      kind = "新築一戸建て"
                  else:
                      kind = "不明"
                  buckets[kind].append(url)
              return buckets


          def text_content(page_html):
              page_html = re.sub(
                  r"<(script|style|noscript)\b[^>]*>.*?</\1>",
                  " ",
                  page_html,
                  flags=re.I | re.S,
              )
              value = re.sub(r"<[^>]+>", " ", page_html)
              return re.sub(r"\s+", " ", html.unescape(value)).strip()


          def first_match(text, patterns):
              for pattern in patterns:
                  match = re.search(pattern, text, flags=re.I)
                  if match:
                      return re.sub(r"\s+", " ", match.group(1)).strip()
              return None


          def structured_fields(page_html):
              parser = StructuredFieldParser()
              parser.feed(page_html)
              aliases = {
                  "land_right": {"土地権利"},
                  "built": {"築年月", "建築年月"},
              }
              found = {}
              contexts = {}
              for index, item in enumerate(parser.items):
                  label = re.sub(r"[：:]$", "", item["text"]).strip()
                  field = next(
                      (name for name, labels in aliases.items() if label in labels), None
                  )
                  if not field or field in found:
                      continue
                  expected = "td" if item["tag"] == "th" else "dd" if item["tag"] == "dt" else item["tag"]
                  adjacent = next((
                      candidate for candidate in parser.items[index + 1:index + 4]
                      if candidate["tag"] == expected
                      and candidate["group"] == item["group"]
                      and candidate["text"]
                  ), None)
                  if adjacent:
                      found[field] = adjacent["text"]
                  # 値と属性だけの安全な再構成。元HTMLや個人情報を広範囲に出さない。
                  nearby = parser.items[max(0, index - 1):index + 3]
                  contexts[field] = " ".join(
                      f"<{part['tag']}>{html.escape(part['text'][:160])}</{part['tag']}>"
                      for part in nearby
                  )[:800]
              return found, contexts


          def extract_fields(page_html):
              # HTMLの表示文言を対象にするため、実運用前にラベルと値を目視確認できる。
              text = text_content(page_html)
              separator = r"\s*(?:：|:)?\s*"
              structured, contexts = structured_fields(page_html)
              fields = {
                  "property_type_raw": first_match(text, (
                      rf"(?:物件種目|物件種別){separator}([^｜|]{{1,30}})",
                  )),
                  "price": first_match(text, (
                      rf"(?:価格|販売価格){separator}([^｜|]{{1,40}}?万円)",
                      r"(\d[\d,]*(?:\.\d+)?\s*万円)",
                  )),
                  "building_area": first_match(text, (
                      rf"(?:建物面積|建物延べ面積){separator}([^｜|]{{1,45}}?(?:m²|㎡|平方メートル))",
                  )),
                  "built": structured.get("built") or first_match(text, (
                      rf"(?:築年月|建築年月){separator}([^｜|]{{0,25}}?\d{{4}}\s*年\s*\d{{1,2}}\s*月)",
                  )),
                  "station_walk": first_match(text, (
                      r"((?:徒歩|歩)\s*\d+\s*分)",
                  )),
                  # 「権利」などの曖昧な全文検索は禁止し、完全一致ラベルの隣だけを見る。
                  "land_right": structured.get("land_right"),
                  "address": first_match(text, (
                      rf"(?:所在地|住所){separator}([^｜|]{{1,80}}?(?:都|道|府|県)[^｜|]{{0,60}})",
                  )),
              }
              return fields, contexts


          def classify_property_type(fields, page_html, url):
              """表示上の物件種目を優先し、新築と中古だけを厳密に分類する。"""
              raw = fields.get("property_type_raw") or ""
              candidates = [raw]
              # 物件種目がmeta/titleにだけあるページにも対応する。ナビゲーションに
              # 両方の文言が現れるため、ページ全体の単純な文字列検索はしない。
              for tag_value in re.findall(
                  r"<title\b[^>]*>(.*?)</title>|<meta\b[^>]*(?:property|name)="
                  r"[\"'](?:og:title|twitter:title)[\"'][^>]*content=[\"']([^\"']+)",
                  page_html,
                  flags=re.I | re.S,
              ):
                  candidates.append(next((value for value in tag_value if value), ""))
              if "/kodate/shinchiku/" in url:
                  candidates.append("新築一戸建て")
              elif "/kodate/chuko/" in url:
                  candidates.append("中古一戸建て")

              for candidate in candidates:
                  normalized = re.sub(r"\s+", "", html.unescape(candidate))
                  if "中古一戸建て" in normalized or "中古戸建て" in normalized:
                      return "中古一戸建て"
                  if "新築一戸建て" in normalized or "新築戸建て" in normalized:
                      return "新築一戸建て"
              return None


          def number(value):
              if not value:
                  return None
              match = re.search(r"\d[\d,]*(?:\.\d+)?", value)
              return float(match.group().replace(",", "")) if match else None


          def age_years(value):
              if not value:
                  return None
              match = re.search(r"(\d{4})\s*年(?:\s*(\d{1,2})\s*月)?", value)
              if not match:
                  return None
              now = time.localtime()
              year, month = int(match.group(1)), int(match.group(2) or 1)
              return now.tm_year - year - ((now.tm_mon, 1) < (month, 1))


          def evaluate_conditions(fields):
              property_type = fields["property_type"]
              price = number(fields.get("price"))
              area = number(fields.get("building_area"))
              walk = number(fields.get("station_walk"))
              age = age_years(fields.get("built"))
              checks = {
                  "price_7000_man_yen_or_less": price is not None and price <= 7000,
                  "building_area_70_m2_or_more": area is not None and area >= 70,
                  "station_walk_15_minutes_or_less": walk is not None and walk <= 15,
                  "land_right_is_ownership": bool(
                      fields.get("land_right") and "所有権" in fields["land_right"]
                  ),
                  # 新築は築年条件を常に満たす。中古だけ実際の築年月を評価する。
                  "age_25_years_or_less": (
                      property_type == "新築一戸建て"
                      or (property_type == "中古一戸建て" and age is not None and age <= 25)
                  ),
              }
              return {
                  "parsed": {
                      "price_man_yen": price,
                      "building_area_m2": area,
                      "station_walk_minutes": walk,
                      "age_years": 0 if property_type == "新築一戸建て" else age,
                  },
                  "checks": checks,
                  "matches": all(checks.values()),
              }


          report = {
              "search_url": SEARCH_URL,
              "expected_cities": [
                  "中野区", "杉並区", "豊島区", "練馬区", "立川市",
                  "武蔵野市", "三鷹市", "西東京市",
              ],
              "excluded_city": "八王子市",
              "final_filter_reference": {
                  "property_types": ["新築一戸建て", "中古一戸建て"],
                  "max_price_man_yen": 7000,
                  "min_building_area_m2": 70,
                  "max_age_years": 25,
                  "age_condition_applies_to": "中古一戸建てのみ（新築一戸建ては適合扱い）",
                  "max_station_walk_minutes": 15,
                  "land_right": "所有権",
              },
          }

          print("::group::1. Fetch list page")
          listing = fetch(SEARCH_URL)
          report["list_fetch"] = {key: value for key, value in listing.items() if key != "text"}
          print(json.dumps(report["list_fetch"], ensure_ascii=False, indent=2))
          print("::endgroup::")

          if listing.get("status") != 200 or not listing.get("text"):
              report["result"] = "list_fetch_failed"
              with open("athome-investigation.json", "w", encoding="utf-8") as file:
                  json.dump(report, file, ensure_ascii=False, indent=2)
              sys.exit("一覧ページを取得できませんでした")

          links = parse_links(listing["text"], listing["final_url"])
          properties = property_urls(links)
          report["property_url_count"] = len(properties)
          report["property_url_samples"] = properties[:10]
          print("::group::2. Property detail URLs")
          print(json.dumps(report["property_url_samples"], ensure_ascii=False, indent=2))
          print(f"unique property URLs: {len(properties)}")
          print("::endgroup::")

          try:
              pages = pagination_candidates(links)
              report["pagination_candidates"] = pages[:20]
              report["pagination_evidence"] = pagination_evidence(
                  listing["text"], listing["final_url"]
              )
          except Exception as error:
              # ページ送り調査は補助情報なので、失敗しても詳細調査を継続し、
              # 後続処理が別の理由で終了する場合にも診断結果を artifact に残す。
              report["pagination_candidates"] = []
              report["pagination_evidence"] = {}
              report["pagination_error"] = f"{type(error).__name__}: {error}"
              with open("athome-investigation.json", "w", encoding="utf-8") as file:
                  json.dump(report, file, ensure_ascii=False, indent=2)
              print(f"::warning::ページ送り調査を継続できませんでした: {report['pagination_error']}")
          print("::group::3. Pagination")
          print(json.dumps(report["pagination_candidates"], ensure_ascii=False, indent=2))
          print(json.dumps(report["pagination_evidence"], ensure_ascii=False, indent=2))
          print("q is intentionally excluded: run #3 proved q=2 returns the same listings.")
          print("The controls, onclick/data attributes, scripts and API clues above are the pagination evidence.")
          print("::endgroup::")

          listing_candidates = listing_type_candidates(listing["text"], properties)
          report["listing_type_candidates"] = {
              kind: urls[:10] for kind, urls in listing_candidates.items()
          }
          # 各種別を最大2件まで優先する。不明候補は誤判定時の少数探索用。
          detail_queue = []
          for index in range(2):
              for kind in ("新築一戸建て", "中古一戸建て"):
                  if index < len(listing_candidates[kind]):
                      detail_queue.append(listing_candidates[kind][index])
          detail_queue.extend(listing_candidates["不明"])
          detail_queue.extend(properties)
          detail_queue = list(dict.fromkeys(detail_queue))[:MAX_DETAIL_SAMPLES]
          report["detail_selection"] = {
              "strategy": "一覧種別候補を交互に優先し、不明候補を1件ずつ少数探索",
              "max_requests": MAX_DETAIL_SAMPLES,
              "queue": detail_queue,
          }
          print("::group::3b. Listing type candidates and detail queue")
          print(json.dumps(report["listing_type_candidates"], ensure_ascii=False, indent=2))
          print(json.dumps(report["detail_selection"], ensure_ascii=False, indent=2))
          print("::endgroup::")

          detail_reports = []
          print("::group::4. Detail fields")
          confirmed_types = set()
          stopped_on_limited_page = False
          for url in detail_queue:
              time.sleep(DETAIL_REQUEST_INTERVAL_SECONDS)
              detail = fetch(url)
              limited_page = bool(
                  detail.get("text")
                  and detail.get("bytes", 0) < MIN_DETAIL_PAGE_BYTES
              )
              if limited_page:
                  fields, field_contexts = {}, {}
              elif detail.get("text"):
                  fields, field_contexts = extract_fields(detail["text"])
              else:
                  fields, field_contexts = {}, {}
              if fields:
                  fields["property_type"] = classify_property_type(
                      fields, detail["text"], url
                  )
              item = {
                  "url": url,
                  "fetch": {key: value for key, value in detail.items() if key != "text"},
                  "page_classification": (
                      "取得制限・簡易ページ候補" if limited_page else "通常ページ候補"
                  ),
                  "fields": fields,
                  "structured_label_contexts": field_contexts,
                  "filter_evaluation": evaluate_conditions(fields)
                  if fields.get("property_type") else None,
              }
              detail_reports.append(item)
              print(json.dumps(item, ensure_ascii=False, indent=2))
              if fields.get("property_type"):
                  confirmed_types.add(fields["property_type"])
              if limited_page:
                  stopped_on_limited_page = True
                  print("::warning::取得制限・簡易ページ候補を検出したため、残りの詳細取得を打ち切ります")
                  break
              if confirmed_types == {"新築一戸建て", "中古一戸建て"}:
                  print("両方の物件種別を確認できたため、詳細探索を終了します")
                  break
          print("::endgroup::")
          report["details"] = detail_reports
          report["detail_selection"]["stopped_on_limited_page"] = stopped_on_limited_page
          report["property_type_counts"] = {
              property_type: sum(
                  item["fields"].get("property_type") == property_type
                  for item in detail_reports
              )
              for property_type in ("新築一戸建て", "中古一戸建て")
          }
          report["matching_properties"] = [
              item for item in detail_reports
              if item["filter_evaluation"] and item["filter_evaluation"]["matches"]
          ]

          missing = []
          for item in detail_reports:
              absent = [name for name, value in item["fields"].items() if not value]
              if absent:
                  missing.append({"url": item["url"], "fields": absent})
          report["missing_detail_fields"] = missing
          both_types_confirmed = all(report["property_type_counts"].values())
          report["result"] = "completed" if both_types_confirmed else "incomplete"
          if not both_types_confirmed:
              report["warning"] = (
                  "新築一戸建てと中古一戸建ての両方は確認できませんでした。"
                  "アクセス抑制のため調査結果を incomplete とし、Workflowは継続します。"
              )

          with open("athome-investigation.json", "w", encoding="utf-8") as file:
              json.dump(report, file, ensure_ascii=False, indent=2)

          if not properties:
              sys.exit("一覧から物件詳細URLを抽出できませんでした")
          if (not stopped_on_limited_page) and (not detail_reports or not any(
              any(item["fields"].values()) for item in detail_reports
          )):
              sys.exit("詳細ページの項目を抽出できませんでした")
          if not both_types_confirmed:
              print(f"::warning::{report['warning']}")
          PY

      - name: Upload investigation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: athome-investigation-report
          path: athome-investigation.json
          if-no-files-found: warn
          retention-days: 7
